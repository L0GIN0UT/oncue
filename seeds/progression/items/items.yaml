# Сид косметики (5b, ADR 0045-0048). Слоты и редкости - из seeds/progression/config.yaml (секция shop).
# Картинки лежат рядом: images/<key>.webp, генерируются seeds/progression/generate_items.py
# (детерминированно, каждая <= 50 КБ). Грузит `gv dev seed` через admin-API progression.
#
# Порядок засева (см. services/progression/CLAUDE.md): конфиг v1 публикует progression.config.bootstrap
# с shop.custom_avatar_item_key = null; затем `gv dev seed` заводит предметы и публикует следующую версию
# конфига с ключом из `custom_avatar_item_key` ниже (публикация требует, чтобы предмет уже существовал).
custom_avatar_item_key: custom_avatar

items:
