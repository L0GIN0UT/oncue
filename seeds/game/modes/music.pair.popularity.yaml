# «Больше/меньше» по популярности трека (D9); отрывок — профиль audio_intro/preview media.
key: music.pair.popularity
title_i18n: modes.music.pair.popularity.title
description_i18n: modes.music.pair.popularity.description
domain: music
source:
  type: pair
  params:
    metric: popularity
    min_gap: 1.0
    ties: both_correct
    pool:
      kinds: [track]
      min_playable: 10
clue:
  type: audio_intro
  params:
    start_s: 0
    levels:
      - { seconds: 15 }
answer:
  format: pick
  matcher:
    type: metric_compare
    params: {}
scoring:
  type: streak
  params:
    points_per_round: 1
session:
  kind: solo
  rounds: 200
  attempts_per_level: 1
  skip_allowed: false
  give_up_allowed: false
  allow_guest: true
  abandon_after_min: 120
  end:
    type: lives
    params: { count: 1 }
features:
  share: true
  records: true
