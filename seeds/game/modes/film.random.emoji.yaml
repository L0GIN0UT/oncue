# Фильм в эмодзи (ADR 0024); clue.params = профиль emoji/default media.
key: film.random.emoji
title_i18n: modes.film.random.emoji.title
description_i18n: modes.film.random.emoji.description
domain: film
source:
  type: random
  params:
    pool:
      kinds: [film]
      min_playable: 10
clue:
  type: emoji
  params:
    levels:
      - { count: 1 }
      - { count: 2 }
      - { count: 3 }
      - { count: 4 }
      - { count: 6 }
      - { count: null }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 5
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
