# clue.params совпадают с профилем audio_intro/default media-pipeline (D7: params_hash).
key: music.random.classic
title_i18n: modes.music.random.classic.title
description_i18n: modes.music.random.classic.description
domain: music
source:
  type: random
  params:
    pool:
      kinds: [track]
      min_playable: 20
    presets:
      - id: oldies
        title_i18n: modes.presets.oldies
        filters: { years: { to: 1989 } }
      - id: modern
        title_i18n: modes.presets.modern
        filters: { years: { from: 1990 } }
      - id: rock
        title_i18n: modes.presets.rock
        filters: { genres_any: [rock, рок, hard-rock] }
clue:
  type: audio_intro
  params:
    start_s: 0
    levels:
      - { seconds: 0.5 }
      - { seconds: 1 }
      - { seconds: 2 }
      - { seconds: 4 }
      - { seconds: 8 }
      - { seconds: 15 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: [artist]
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 5
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
