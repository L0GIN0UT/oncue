# Черновик сида случайного режима (шаг 0a плана этапа 2, §2.5); наполняет поток B.
# clue.params совпадают с профилем audio_intro/default media-pipeline (D7: params_hash).
key: music.random.classic
title_i18n: modes.music.random.classic.title
description_i18n: modes.music.random.classic.description
domain: music
source:
  type: random
  params:
    pool:
      kinds: [track]
      min_playable: 20
    presets:
      - id: y2000s
        title_i18n: modes.presets.y2000s
        filters: { years: { from: 2000, to: 2009 } }
      - id: y2010s
        title_i18n: modes.presets.y2010s
        filters: { years: { from: 2010, to: 2019 } }
      - id: rock
        title_i18n: modes.presets.rock
        filters: { genres_any: [rock] }
clue:
  type: audio_intro
  params:
    start_s: 0
    levels:
      - { seconds: 0.5 }
      - { seconds: 1 }
      - { seconds: 2 }
      - { seconds: 4 }
      - { seconds: 8 }
      - { seconds: 15 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: [artist]
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 10
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
