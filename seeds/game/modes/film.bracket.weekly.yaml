# Недельная сетка топ-16 (D10, ADR 0027): тема — режиссёр с ≥ 24 играбельными фильмами
# (в сетку берутся 16), 15 выборов, очков нет; кадр — профиль frame_progressive/still media.
key: film.bracket.weekly
title_i18n: modes.film.bracket.weekly.title
description_i18n: modes.film.bracket.weekly.description
domain: film
source:
  type: bracket
  params:
    size: 16
    period: week
    timezone: Europe/Moscow
    schedule_ahead_periods: 1
    subject:
      roles: [director]
      min_items: 24
    pool:
      kinds: [film]
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 0, crop: 1, max_width: 960 }
answer:
  format: pick
  matcher:
    type: preference
    params: {}
scoring:
  type: none
  params: {}
session:
  kind: solo
  rounds: 15
  attempts_per_level: 1
  skip_allowed: false
  give_up_allowed: false
  allow_guest: true
  abandon_after_min: 10080
features:
  share: true
