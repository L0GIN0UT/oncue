# Марафон по режиссёру (D14): фильмы выбранных персон по году, 3 «жизни» (D3).
key: film.marathon.director
title_i18n: modes.film.marathon.director.title
description_i18n: modes.film.marathon.director.description
domain: film
source:
  type: marathon
  params:
    roles: [director]
    max_subjects: 3
    min_items: 5
    order: year
    pool:
      kinds: [film]
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 25, crop: 0.35, max_width: 960 }
      - { blur_px: 20, crop: 0.5, max_width: 960 }
      - { blur_px: 15, crop: 0.7, max_width: 960 }
      - { blur_px: 10, crop: 1.0, max_width: 960 }
      - { blur_px: 5, crop: 1.0, max_width: 960 }
      - { blur_px: 0, crop: 1.0, max_width: 960 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 200
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
  end:
    type: lives
    params: { count: 3 }
features:
  share: true
  records: true
