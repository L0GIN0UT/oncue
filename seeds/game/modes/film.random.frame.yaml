# clue.params совпадают с профилем frame_progressive/default media-pipeline (D7).
key: film.random.frame
title_i18n: modes.film.random.frame.title
description_i18n: modes.film.random.frame.description
domain: film
source:
  type: random
  params:
    pool:
      kinds: [film]
      min_playable: 20
    presets:
      - id: y1990s
        title_i18n: modes.presets.y1990s
        filters: { years: { from: 1990, to: 1999 } }
      - id: from2000
        title_i18n: modes.presets.from2000
        filters: { years: { from: 2000 } }
      - id: drama
        title_i18n: modes.presets.drama
        filters: { genres_any: [драма] }
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 48, crop: 0.35, max_width: 960 }
      - { blur_px: 32, crop: 0.5, max_width: 960 }
      - { blur_px: 20, crop: 0.7, max_width: 960 }
      - { blur_px: 12, crop: 1.0, max_width: 960 }
      - { blur_px: 6, crop: 1.0, max_width: 960 }
      - { blur_px: 0, crop: 1.0, max_width: 960 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 5
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
