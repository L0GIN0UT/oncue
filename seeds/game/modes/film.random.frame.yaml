# clue.params совпадают с профилем frame_progressive/default media-pipeline (D7).
key: film.random.frame
title_i18n: modes.film.random.frame.title
description_i18n: modes.film.random.frame.description
domain: film
source:
  type: random
  params:
    pool:
      kinds: [film]
      min_playable: 20
    presets:
      # Пресеты по данным каталога (10 000 фильмов, сериалов, мультфильмов, аниме): до 1989
      # (около 1 200 единиц), десятилетия и самые частые жанры (в каждом больше 1 000).
      - id: to1989
        title_i18n: modes.presets.to1989
        filters: { years: { to: 1989 } }
      - id: y1990s
        title_i18n: modes.presets.y1990s
        filters: { years: { from: 1990, to: 1999 } }
      - id: y2000s
        title_i18n: modes.presets.y2000s
        filters: { years: { from: 2000, to: 2009 } }
      - id: y2010s
        title_i18n: modes.presets.y2010s
        filters: { years: { from: 2010, to: 2019 } }
      - id: y2020s
        title_i18n: modes.presets.y2020s
        filters: { years: { from: 2020 } }
      - id: drama
        title_i18n: modes.presets.drama
        filters: { genres_any: [драма] }
      - id: comedy
        title_i18n: modes.presets.comedy
        filters: { genres_any: [комедия] }
      - id: action
        title_i18n: modes.presets.action
        filters: { genres_any: [боевик, "боевик и приключения"] }
      - id: thriller
        title_i18n: modes.presets.thriller
        filters: { genres_any: [триллер, криминал, детектив] }
      - id: scifi
        title_i18n: modes.presets.scifi
        filters: { genres_any: [фантастика, "нф и фэнтези", фэнтези] }
      - id: horror
        title_i18n: modes.presets.horror
        filters: { genres_any: [ужасы] }
      - id: animation
        title_i18n: modes.presets.animation
        filters: { genres_any: [мультфильм] }
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 25, crop: 0.35, max_width: 960 }
      - { blur_px: 20, crop: 0.5, max_width: 960 }
      - { blur_px: 15, crop: 0.7, max_width: 960 }
      - { blur_px: 10, crop: 1.0, max_width: 960 }
      - { blur_px: 5, crop: 1.0, max_width: 960 }
      - { blur_px: 0, crop: 1.0, max_width: 960 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 5
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
