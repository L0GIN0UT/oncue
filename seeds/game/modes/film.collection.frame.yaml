# Фильмы сборника по кадру: шаблон режима сборника (ADR 0028), сборник и число раундов — при старте.
# clue.params = профиль frame_progressive/default media-pipeline (D7).
# session.rounds — потолок для «all»; features.records выключен (план 3b, D4).
key: film.collection.frame
title_i18n: modes.film.collection.frame.title
description_i18n: modes.film.collection.frame.description
domain: film
source:
  type: collection
  params:
    round_options: [5, 10, 25, all]
    min_items: 5
    shuffle: true
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 25, crop: 0.35, max_width: 960 }
      - { blur_px: 20, crop: 0.5, max_width: 960 }
      - { blur_px: 15, crop: 0.7, max_width: 960 }
      - { blur_px: 10, crop: 1.0, max_width: 960 }
      - { blur_px: 5, crop: 1.0, max_width: 960 }
      - { blur_px: 0, crop: 1.0, max_width: 960 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
  subject_mode: single_subject
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 200
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
