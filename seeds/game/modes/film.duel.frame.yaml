# Дуэль 1×1 по кадру фильма (ADR 0032): шесть уровней кадра, 3 попытки на уровень,
# точный ответ соперника закрывает уровень для обоих (race).
# clue.params = профиль frame_progressive/default media-pipeline (D7).
key: film.duel.frame
title_i18n: modes.film.duel.frame.title
description_i18n: modes.film.duel.frame.description
domain: film
source:
  type: random
  params:
    pool:
      kinds: [film]
      min_playable: 20
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 25, crop: 0.35, max_width: 960 }
      - { blur_px: 20, crop: 0.5, max_width: 960 }
      - { blur_px: 15, crop: 0.7, max_width: 960 }
      - { blur_px: 10, crop: 1.0, max_width: 960 }
      - { blur_px: 5, crop: 1.0, max_width: 960 }
      - { blur_px: 0, crop: 1.0, max_width: 960 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: duel
  players: { min: 2, max: 2 }
  rounds: 7
  countdown_s: 3
  level_windows_s: [15, 15, 15, 15, 15, 15]
  reveal_s: 5
  contest:
    type: race
    params: { attempts_per_level: 3, lock_on_first_correct: true }
  disconnect_grace_s: 30
  chat:
    emotes: [match.emotes.wow, match.emotes.gg, match.emotes.fire, match.emotes.laugh, match.emotes.think]
    phrases: [match.phrases.good_luck, match.phrases.well_played, match.phrases.nice_one, match.phrases.so_close]
