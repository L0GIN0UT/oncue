# clue.params совпадают с профилем audio_intro/default media-pipeline (D7: params_hash).
key: music.daily.classic
title_i18n: modes.music.daily.classic.title
description_i18n: modes.music.daily.classic.description
domain: music
source:
  type: daily
  params:
    size: 5
    timezone: Europe/Moscow
    schedule_ahead_days: 2
    exclude_recent_days: 7
    pool:
      kinds: [track]
      min_playable: 10
clue:
  type: audio_intro
  params:
    start_s: 0
    levels:
      - { seconds: 0.5 }
      - { seconds: 1 }
      - { seconds: 2 }
      - { seconds: 4 }
      - { seconds: 8 }
      - { seconds: 15 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: [artist]
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 5
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 1440
features:
  share: true
