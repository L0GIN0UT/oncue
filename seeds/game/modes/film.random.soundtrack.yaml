# Саундтрек фильма; clue.params = профиль soundtrack/default media (D7).
key: film.random.soundtrack
title_i18n: modes.film.random.soundtrack.title
description_i18n: modes.film.random.soundtrack.description
domain: film
source:
  type: random
  params:
    pool:
      kinds: [film]
      min_playable: 10
clue:
  type: soundtrack
  params:
    start_s: 0
    levels:
      - { seconds: 0.5 }
      - { seconds: 1 }
      - { seconds: 2 }
      - { seconds: 4 }
      - { seconds: 8 }
      - { seconds: 15 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: by_level
  params:
    points: [6, 5, 4, 3, 2, 1]
    partial_ratio: 0.5
session:
  kind: solo
  rounds: 5
  attempts_per_level: 1
  skip_allowed: true
  give_up_allowed: true
  allow_guest: true
  abandon_after_min: 120
features:
  share: true
