# Кастомное лобби по музыке (D12; референс Songless §8.4): один уровень — отрывок 15 с,
# до 3 попыток, очки за скорость (party_speed, максимум 30), только исполнитель — ×0,5.
# Хост выбирает из lobby.overridable; свободный чат — только в лобби (ADR 0036).
# clue.params = профиль audio_intro/preview media-pipeline (D7).
key: music.lobby.classic
title_i18n: modes.music.lobby.classic.title
description_i18n: modes.music.lobby.classic.description
domain: music
source:
  type: random
  params:
    pool:
      kinds: [track]
      min_playable: 20
clue:
  type: audio_intro
  params:
    start_s: 0
    levels:
      - { seconds: 15 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: [artist]
scoring:
  type: party_speed
  params: { max_points: 30, partial_ratio: 0.5 }
session:
  kind: lobby
  players: { min: 2, max: 6 }
  rounds: 10
  countdown_s: 3
  level_windows_s: [35]
  reveal_s: 5
  contest:
    type: parallel
    params: { attempts_per_level: 3, end_when_all_answered: true }
  disconnect_grace_s: 30
  lobby:
    visibility: private
    overridable:
      rounds: [5, 10, 15, 20]
      level_window_s: [20, 35, 55]
      players_max: [2, 4, 6]
      visibility: [public, private]
  chat:
    emotes: [match.emotes.wow, match.emotes.gg, match.emotes.fire, match.emotes.laugh, match.emotes.think]
    phrases: [match.phrases.good_luck, match.phrases.well_played, match.phrases.nice_one, match.phrases.so_close]
    free_text: true
