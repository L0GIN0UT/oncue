# Рейтинговая дуэль (music, классика): подбор из очереди ladder-а `music` (ADR 0038). Правила — как у `music.duel.classic`; шаблон находится по `session.ranked` + `session.ladder` + `answer.format`.
# clue.params и очки — как у обычной дуэли (профили media-pipeline те же, D7).
key: music.ranked.classic
title_i18n: modes.music.ranked.classic.title
description_i18n: modes.music.ranked.classic.description
domain: music
source:
  type: random
  params:
    pool:
      kinds:
      - track
      min_playable: 20
clue:
  type: audio_intro
  params:
    start_s: 0
    levels:
    - seconds: 4
    - seconds: 15
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
      - min_len: 5
        max_distance: 1
      - min_len: 10
        max_distance: 2
      accept_same_title: true
  partial:
  - artist
scoring:
  type: by_level
  params:
    points:
    - 12
    - 6
    partial_ratio: 0.5
session:
  kind: duel
  players:
    min: 2
    max: 2
  rounds: 7
  countdown_s: 3
  level_windows_s:
  - 20
  - 30
  reveal_s: 5
  contest:
    type: race
    params:
      attempts_per_level: 3
      lock_on_first_correct: true
  disconnect_grace_s: 30
  chat:
    emotes:
    - match.emotes.wow
    - match.emotes.gg
    - match.emotes.fire
    - match.emotes.laugh
    - match.emotes.think
    phrases:
    - match.phrases.good_luck
    - match.phrases.well_played
    - match.phrases.nice_one
    - match.phrases.so_close
  ranked: true
  ladder: music
