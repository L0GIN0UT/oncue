[project]
name = "gv-auth"
version = "0.1.0"
description = "Аутентификация и авторизация: проверка JWT по JWKS, Principal, зависимости FastAPI."
requires-python = ">=3.13"
dependencies = ["gv-core", "pyjwt[crypto]>=2.10", "httpx>=0.28", "fastapi>=0.115"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_auth"]
