[project]
name = "gv-testkit"
version = "0.1.0"
description = "Общий модуль тестирования: фейки, фикстуры инфраструктуры, тестовые JWT, хелперы событий и API."
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-auth", "gv-service", "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "asgi-lifespan>=2.1", "testcontainers[postgres,redis,kafka,rabbitmq,opensearch,minio]>=4.8", "polyfactory>=2.18", "cryptography>=43", "respx>=0.21", "jsonschema>=4.23", "moto[server]>=5.0"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_testkit"]

[project.entry-points.pytest11]
gv_testkit = "gv_testkit.pytest_plugin"
