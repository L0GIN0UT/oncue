[project]
name = "gv-text"
version = "0.1.0"
description = "Нормализация названий и алиасов, транслитерация, расстояние Дамерау-Левенштейна (чистый Python)."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_text"]
