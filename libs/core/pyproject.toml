[project]
name = "gv-core"
version = "0.1.0"
description = "Базовые строительные блоки домена: идентификаторы, агрегаты, события, ошибки, контекст запроса."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
