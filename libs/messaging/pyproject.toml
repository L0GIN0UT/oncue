[project]
name = "gv-messaging"
version = "0.1.0"
description = "Доменные события и задачи: envelope, outbox/inbox, Redpanda (Kafka API), RabbitMQ."
requires-python = ">=3.13"
dependencies = ["gv-core", "structlog>=24.4", "pydantic>=2.9", "sqlalchemy[asyncio]>=2.0.36", "aiokafka>=0.12", "aio-pika>=9.5", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_messaging"]
