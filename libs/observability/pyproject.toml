[project]
name = "gv-observability"
version = "0.1.0"
description = "Логи (structlog JSON), метрики Prometheus, трейсинг OpenTelemetry."
requires-python = ">=3.13"
dependencies = ["gv-core", "structlog>=24.4", "prometheus-client>=0.21", "opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28", "opentelemetry-exporter-otlp-proto-http>=1.28", "opentelemetry-instrumentation-fastapi>=0.49b0", "fastapi>=0.115"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_observability"]
