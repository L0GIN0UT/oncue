[project]
name = "gv-flags"
version = "0.1.0"
description = "Фича-флаги: интерфейс, статическая реализация, адаптер Unleash."
requires-python = ">=3.13"
dependencies = ["gv-core", "UnleashClient>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_flags"]
