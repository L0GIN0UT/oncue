# Онлайн-конфиг для contract-тестов ядра (шаг 0a этапа 4, ADR 0032); сиды game — поток B.
key: film.lobby.collection
title_i18n: modes.film.lobby.collection.title
description_i18n: modes.film.lobby.collection.description
domain: film
source:
  type: collection
  params:
    # Варианты не больше session.rounds (ADR 0028); число раундов лобби выбирает хост
    # из session.lobby.overridable.rounds.
    round_options: [5, 10]
    min_items: 5
    max_collections: 3
clue:
  type: frame_progressive
  params:
    levels:
      - { blur_px: 48, crop: 0.35, max_width: 960 }
      - { blur_px: 32, crop: 0.5, max_width: 960 }
      - { blur_px: 20, crop: 0.7, max_width: 960 }
      - { blur_px: 12, crop: 1.0, max_width: 960 }
      - { blur_px: 6, crop: 1.0, max_width: 960 }
      - { blur_px: 0, crop: 1.0, max_width: 960 }
answer:
  format: classic
  matcher:
    type: title_alias
    params:
      typo:
        - { min_len: 5, max_distance: 1 }
        - { min_len: 10, max_distance: 2 }
      accept_same_title: true
  partial: []
scoring:
  type: party_speed
  params: { max_points: 100, partial_ratio: 0.5 }
session:
  kind: lobby
  players: { min: 2, max: 6 }
  rounds: 12
  countdown_s: 3
  level_windows_s: [25, 25, 25, 25, 25, 25]
  reveal_s: 5
  contest:
    type: parallel
    params: { attempts_per_level: 1, end_when_all_answered: true }
  disconnect_grace_s: 30
  lobby:
    visibility: private
    overridable:
      rounds: [5, 10, 12, 20]
      level_window_s: [15, 25, 40]
      players_max: [2, 4, 6]
      visibility: [public, private]
  chat:
    emotes: [match.emotes.wow]
    phrases: [match.phrases.good_luck]
    free_text: true
