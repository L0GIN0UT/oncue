[project]
name = "gv-game-kernel"
version = "0.1.0"
description = "Ядро игрового движка: модели ModeConfig, реестр плагинов, порты, правила раунда (без IO)."
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-text", "pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_game_kernel"]
