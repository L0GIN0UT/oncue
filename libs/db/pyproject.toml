[project]
name = "gv-db"
version = "0.1.0"
description = "PostgreSQL: движок, сессии, Unit of Work с записью доменных событий в outbox."
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-messaging", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30", "alembic>=1.14"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gv_db"]
