# CI Guessverse (docs/04-testing.md §7, docs/07-infrastructure.md §5).
# На PR — только затронутые модули и их зависимые; на main — то же + публикация образов.
name: ci

on:
  pull_request:
    # labeled — чтобы метка `e2e` запускала e2e-smoke на PR (план этапа 2, §2.1).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.13"
  # База сравнения: для PR — целевая ветка, для push — предыдущий коммит main.
  BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  changes:
    name: Затронутые модули
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages
      - id: matrix
        run: |
          matrix=$(uv run gv ci matrix --base "$BASE_REF")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$matrix" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  lint:
    name: Статические проверки и контракты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages
      - name: ruff, mypy, import-linter, gen --check, contracts (актуальность)
        run: uv run gv lint
      - name: Документация собирается (битые ссылки и докстринги ломают сборку)
        run: uv run mkdocs build --strict
      - name: Совместимость контрактов с базой
        run: uv run gv contracts check --base "$BASE_REF"
      - name: Секреты в коде
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Уязвимости зависимостей
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --all-packages --no-dev --no-hashes --no-emit-workspace)

  test:
    name: Тесты ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI=true: недоступная инфраструктура роняет тест, а не пропускает его (gv_testkit.infra).
      # Kafka, RabbitMQ и OpenSearch поднимает testcontainers (Docker на раннере), S3 — moto_server
      # из зависимостей testkit (без Docker).
      CI: "true"
      GV_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      GV_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages
      - name: Системные пакеты для тестов media-pipeline
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: unit + integration + component + contract
        run: uv run gv test "${{ matrix.path }}" --cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    # Фронтенд (Next.js, поток D этапа 2): свой lock и инструменты внутри frontend/.
    # Пока frontend/package.json нет, job проходит без шагов (условие на каждом шаге).
    name: Фронтенд
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: app
        name: Есть ли frontend/
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json отсутствует — проверки фронтенда пропущены"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        if: steps.app.outputs.present == 'true'
        with: { package_json_file: frontend/package.json }  # версия — из поля packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.app.outputs.present == 'true'
        run: pnpm -C frontend install --frozen-lockfile
      - name: Типы API совпадают с contracts/openapi
        if: steps.app.outputs.present == 'true'
        run: pnpm -C frontend gen:api:check
      - if: steps.app.outputs.present == 'true'
        run: pnpm -C frontend lint
      - if: steps.app.outputs.present == 'true'
        run: pnpm -C frontend typecheck
      - name: Типы e2e полного стека (e2e/*.spec.ts, зависимости — из frontend)
        if: steps.app.outputs.present == 'true' && hashFiles('e2e/tsconfig.json') != ''
        run: pnpm -C frontend exec tsc -p ../e2e
      - if: steps.app.outputs.present == 'true'
        run: pnpm -C frontend test
      - if: steps.app.outputs.present == 'true'
        run: pnpm -C frontend build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.app.outputs.present == 'true'
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Playwright на моках API (Chromium)
        if: steps.app.outputs.present == 'true'
        run: |
          pnpm -C frontend exec playwright install --with-deps chromium
          pnpm -C frontend exec playwright test

  nginx:
    # Конфиг gateway проверяется на том же образе, что в compose.gateway.yml: шаблоны
    # (templates/*.template) рендерит entrypoint образа, как при запуске.
    name: Конфиг gateway (nginx -t)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Временный сертификат (nginx -t читает ssl_certificate)
        run: >-
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1
          -subj /CN=localhost -keyout "$RUNNER_TEMP/privkey.pem" -out "$RUNNER_TEMP/fullchain.pem"
      - name: nginx -t на nginx:1.28
        # Своя сеть — встроенный DNS 127.0.0.11 (resolver в nginx.conf); имена upstream
        # с `resolve` не обязаны резолвиться при проверке.
        run: |
          docker network create gv-nginx-check
          docker run --rm --network gv-nginx-check --tmpfs /etc/nginx/conf.d \
            -e NGINX_ENVSUBST_FILTER='^GV_' \
            -e GV_MEDIA_SIGNING_SECRET=ci-nginx-check-not-a-secret-000000 \
            -e GV_MEDIA_ASSETS_BUCKET=gv-assets \
            -e GV_COSMETICS_BUCKET=gv-cosmetics \
            -e GV_GATEWAY_API_RATE=40r/s -e GV_GATEWAY_API_BURST=80 \
            -e GV_GATEWAY_AUTH_RATE=60r/m -e GV_GATEWAY_AUTH_BURST=20 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/generated:/etc/nginx/generated:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v "$RUNNER_TEMP/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro" \
            -v "$RUNNER_TEMP/privkey.pem:/etc/nginx/certs/privkey.pem:ro" \
            nginx:1.28-alpine nginx -t

  e2e-smoke:
    # Полный стек на compose: смоук (e2e/stack.spec.ts, в том числе экран «Онлайн доступен после
    # регистрации»), сценарии «дейлик» (e2e/daily.spec.ts), режимы этапа 3a (e2e/modes.spec.ts),
    # сборники этапа 3b (e2e/collections.spec.ts) и онлайн этапа 4a (e2e/lobby|duel|party.spec.ts:
    # несколько контекстов браузера, Centrifugo, процесс rooms в `match all`), прогресс 5a
    # (e2e/progression.spec.ts), магазин и промокоды 5b (e2e/shop.spec.ts) и уведомления с
    # модерацией своей аватарки 5b (e2e/notifications.spec.ts), друзья и модерация 5c
    # (e2e/friends.spec.ts, e2e/moderation.spec.ts; shop, notifications и moderation требуют
    # учётных данных админа) — все, кроме смоука,
    # только при E2E_SEEDED=1, когда стек засеян, `pnpm test:e2e:stack` (testMatch
    # e2e/playwright.config.ts подхватывает все *.spec.ts). На main и по метке PR `e2e`.
    name: E2E smoke (compose)
    needs: [lint]
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    # Засев режимов 3a (≈ 60 фильмов × 8 исходников) и сетка на 31 выбор — дольше этапа 2;
    # онлайн 4a — ещё три сценария по 3–7 минут (окна уровней — по серверным таймерам).
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      E2E_BASE_URL: https://localhost
      # Шесть браузеров e2e идут с одного IP раннера: лимиты gateway по IP поднимаем
      # (подхватывает compose.gateway.yml; боевые дефолты — 40r/s и 60r/m).
      GV_GATEWAY_API_RATE: 200r/s
      GV_GATEWAY_AUTH_RATE: 300r/m
      # Стек `gv dev up services` + веб-клиент (compose.web.yml), пути — от infra/compose.
      E2E_COMPOSE_FILES: >-
        -f compose.infra.yml -f compose.infra.dev.yml -f compose.services.yml
        -f compose.services.dev.yml -f compose.web.yml -f compose.gateway.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: app
        name: Есть ли фронтенд и e2e
        run: |
          if [ -f frontend/package.json ] && [ -f e2e/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::нет frontend/package.json или e2e/playwright.config.ts — e2e пропущен"
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        if: steps.app.outputs.present == 'true'
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - if: steps.app.outputs.present == 'true'
        run: uv sync --all-packages
      - name: Самоподписанный сертификат gateway
        if: steps.app.outputs.present == 'true'
        # Каталог certs в git пуст (сертификаты не коммитятся) — создаём его сами.
        run: |
          mkdir -p infra/nginx/certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 \
            -subj /CN=localhost -keyout infra/nginx/certs/privkey.pem \
            -out infra/nginx/certs/fullchain.pem
      - name: Стек на compose + веб-клиент (секреты — случайные)
        if: steps.app.outputs.present == 'true'
        working-directory: infra/compose
        run: |
          uv run gv dev secrets > .env
          docker compose --env-file .env ${{ env.E2E_COMPOSE_FILES }} up -d --build --wait --wait-timeout 600
      - name: ffmpeg для генератора исходников засева
        if: steps.app.outputs.present == 'true'
        # seeds/media/generate.py делает синтетические аудио-тоны через ffmpeg; на
        # ubuntu-раннере его нет из коробки. Pillow (кадры) уже в окружении uv.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Засев стека для дейлика, режимов 3a, сборников 3b и онлайна 4a (gv dev seed)
        if: steps.app.outputs.present == 'true'
        # Стек поднят с --wait (миграции завершены → bootstrap-админ создан). Сидер ходит
        # напрямую на опубликованные порты сервисов (compose.services.dev.yml) и грузит
        # каталог (с синтетикой 3a), все виды исходников, наборы дня и недели, кураторские
        # сборники seeds/collections (admin-API collections, ожидание проекций), ждёт онлайн-
        # шаблоны 4a (music.duel.classic, film.duel.frame, film.party.frame, music.lobby.classic,
        # film.lobby.collection — публикует их game из seeds/game/modes при старте), их пулы и
        # сборник film-lobby под шаблон лобби. Успех → E2E_SEEDED=1 раскрывает сценарии.
        run: |
          env_val() { grep -E "^$1=" infra/compose/.env | cut -d= -f2-; }
          export GV_BOOTSTRAP_ADMIN__LOGIN="$(env_val GV_BOOTSTRAP_ADMIN__LOGIN)"
          export GV_BOOTSTRAP_ADMIN__PASSWORD="$(env_val GV_BOOTSTRAP_ADMIN__PASSWORD)"
          export GV_SERVICE_SECRET_ADMIN="$(env_val GV_SERVICE_SECRET_ADMIN)"
          # Секреты из .env не должны попасть в лог прогона.
          echo "::add-mask::${GV_BOOTSTRAP_ADMIN__PASSWORD}"
          echo "::add-mask::${GV_SERVICE_SECRET_ADMIN}"
          uv run gv dev seed
          echo "E2E_SEEDED=1" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        if: steps.app.outputs.present == 'true'
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: E2E — смоук стека (и «дейлик», режимы 3a, сборники 3b, онлайн 4a при E2E_SEEDED=1)
        if: steps.app.outputs.present == 'true'
        # modes.spec.ts и collections.spec.ts ходят в admin-API game/media/collections как
        # `gv dev seed`: учётные данные админа — из .env, в лог не попадают. collections.spec.ts и
        # онлайн-сценарии (e2e/online.ts) регистрируют свежих игроков и берут ссылку
        # подтверждения e-mail из `docker compose logs identity` (E2E_COMPOSE_FILES).
        run: |
          env_val() { grep -E "^$1=" infra/compose/.env | cut -d= -f2-; }
          export GV_BOOTSTRAP_ADMIN__LOGIN="$(env_val GV_BOOTSTRAP_ADMIN__LOGIN)"
          export GV_BOOTSTRAP_ADMIN__PASSWORD="$(env_val GV_BOOTSTRAP_ADMIN__PASSWORD)"
          export GV_SERVICE_SECRET_ADMIN="$(env_val GV_SERVICE_SECRET_ADMIN)"
          echo "::add-mask::${GV_BOOTSTRAP_ADMIN__PASSWORD}"
          echo "::add-mask::${GV_SERVICE_SECRET_ADMIN}"
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend exec playwright install --with-deps chromium
          pnpm -C frontend test:e2e:stack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure() && steps.app.outputs.present == 'true'
        with:
          name: e2e-smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - name: Диагностика наборов дня (game) при падении
        if: failure() && steps.app.outputs.present == 'true'
        working-directory: infra/compose
        # Причина пустого набора дня (пул меньше нужного) логируется в контейнере game;
        # выводим её отдельно, чтобы не искать в общем хвосте логов всех сервисов.
        run: |
          echo "::group::game — наборы дня и проекция"
          docker compose --env-file .env ${{ env.E2E_COMPOSE_FILES }} logs --no-color game \
            | grep -E "daily_pool_too_small|daily_set_ready|daily_items_replaced|assets_ready|game\.daily|pool_empty|theme" \
            || echo "(в логах game нет записей о наборах дня/ассетах)"
          echo "::endgroup::"
      - name: Диагностика онлайна (match, Centrifugo) при падении
        if: failure() && steps.app.outputs.present == 'true'
        working-directory: infra/compose
        # Отказ старта матча (план game, ассеты), lease и handoff комнат — в логе match; отказы
        # соединений и подписок — в логе Centrifugo. Общий хвост логов ниже их обрезает.
        run: |
          for svc in match centrifugo; do
            echo "::group::$svc"
            docker compose --env-file .env ${{ env.E2E_COMPOSE_FILES }} logs --no-color --tail=300 "$svc" || true
            echo "::endgroup::"
          done
          # Предупреждения и ошибки онлайна — аннотациями check run: их видно через API, даже
          # когда логи job недоступны (хранилище логов Actions закрыто для агентов).
          for svc in match game media-pipeline identity centrifugo gateway; do
            docker compose --env-file .env ${{ env.E2E_COMPOSE_FILES }} logs --no-color "$svc" 2>/dev/null \
              | grep -iE '"level": ?"(warning|error|critical)"|level=(warn|error)|\[(warn|error)\]|traceback|exception| 50[0-9] | 40[39] | 409 | 422 ' \
              | tail -n 60 | cut -c1-400 > /tmp/diag.txt || true
            if [ -s /tmp/diag.txt ]; then
              body=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/diag.txt | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::warning title=e2e diag: $svc::$body"
            fi
          done
      - name: Логи стека при падении
        if: failure() && steps.app.outputs.present == 'true'
        working-directory: infra/compose
        run: docker compose --env-file .env ${{ env.E2E_COMPOSE_FILES }} logs --no-color --tail=400 || true

  build:
    name: Образ ${{ matrix.service }}
    needs: [changes, lint, test]
    # test может быть пропущен (нет затронутых модулей) — это не ошибка.
    if: always() && needs.lint.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: matrix.service != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: matrix.service != ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: matrix.service != '' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Имя образа
        id: image
        if: matrix.service != ''
        # Ссылка на образ в Docker допускает только нижний регистр, а владелец
        # репозитория (L0GIN0UT) — в смешанном.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/guessverse-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Сборка (push только с main)
        if: matrix.service != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: infra/docker/python-service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          # На PR образ не публикуется, но загружается локально для сканирования.
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Скан образа — отчётный, не блокирующий (exit-code 0). Уязвимости наших
      # зависимостей строго гейтит pip-audit в job lint (мы их чиним бампом версий);
      # а CRITICAL/HIGH в пакетах базового образа (debian в python:3.13-slim) вне
      # нашего контроля и не должны краснить весь пайплайн — они видны в логе скана.
      # До прода политику ужесточим (CVE базового образа — через обновление базы,
      # ADR 0022). ignore-unfixed убирает шум по CVE без доступного фикса.
      - name: Сканирование образа
        if: matrix.service != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
