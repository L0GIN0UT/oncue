# CI Guessverse (docs/04-testing.md §7, docs/07-infrastructure.md §5).
# На PR — только затронутые модули и их зависимые; на main — то же + публикация образов.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.13"
  # База сравнения: для PR — целевая ветка, для push — предыдущий коммит main.
  BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  changes:
    name: Затронутые модули
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages
      - id: matrix
        run: |
          matrix=$(uv run gv ci matrix --base "$BASE_REF")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$matrix" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  lint:
    name: Статические проверки и контракты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages
      - name: ruff, mypy, import-linter, gen --check, contracts (актуальность)
        run: uv run gv lint
      - name: Документация собирается (битые ссылки и докстринги ломают сборку)
        run: uv run mkdocs build --strict
      - name: Совместимость контрактов с базой
        run: uv run gv contracts check --base "$BASE_REF"
      - name: Секреты в коде
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Уязвимости зависимостей
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --all-packages --no-dev --no-hashes --no-emit-workspace)

  test:
    name: Тесты ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI=true: недоступная инфраструктура роняет тест, а не пропускает его (gv_testkit.infra).
      # Kafka, RabbitMQ, OpenSearch и MinIO поднимает testcontainers (Docker на раннере).
      CI: "true"
      GV_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      GV_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages
      - name: Системные пакеты для тестов media-pipeline
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: unit + integration + component + contract
        run: uv run gv test "${{ matrix.path }}" --cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Образ ${{ matrix.service }}
    needs: [changes, lint, test]
    # test может быть пропущен (нет затронутых модулей) — это не ошибка.
    if: always() && needs.lint.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.service != ''
      - uses: docker/setup-buildx-action@v3
        if: matrix.service != ''
      - uses: docker/login-action@v3
        if: matrix.service != '' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка (push только с main)
        if: matrix.service != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/python-service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          # На PR образ не публикуется, но загружается локально для сканирования.
          load: ${{ github.event_name != 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/guessverse-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Сканирование образа
        if: matrix.service != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/guessverse-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
