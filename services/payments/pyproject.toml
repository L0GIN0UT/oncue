[project]
name = "guessverse-payments"
version = "0.1.0"
description = "Тарифы и подписки, платёжный провайдер, вебхуки, entitlements. Выключен флагом billing.enabled"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth"]

[project.scripts]
payments = "payments_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_service"]
