[project]
name = "guessverse-collections"
version = "0.1.0"
description = "Пользовательские и кураторские сборники: конструктор, черновики, каталог, лайки, избранное"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth", "gv-text", "pyyaml>=6"]

[project.scripts]
collections = "collections_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collections_service"]
