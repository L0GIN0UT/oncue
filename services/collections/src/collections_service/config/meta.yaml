# Словари конструктора сборников (план этапа 3b §2.5, D6, D10).
# Свой файл — GV_COLLECTIONS__META_CONFIG (заменяет этот целиком).
#
# cover_presets — обложки без постеров: градиент (#rrggbb) и эмодзи.
# tags — свободных тегов нет; title_key — ключ перевода фронтенда,
#   domains — где тег доступен, search — слова, по которым сборник ищется в каталоге.
cover_presets:
  - id: night
    gradient: ["#0f2027", "#203a43", "#2c5364"]
    emoji: "🌙"
  - id: sunset
    gradient: ["#ff7e5f", "#feb47b"]
    emoji: "🌅"
  - id: neon
    gradient: ["#fc466b", "#3f5efb"]
    emoji: "✨"
  - id: forest
    gradient: ["#134e5e", "#71b280"]
    emoji: "🌲"
  - id: cinema
    gradient: ["#232526", "#414345"]
    emoji: "🎬"
  - id: vinyl
    gradient: ["#41295a", "#2f0743"]
    emoji: "🎵"
  - id: popcorn
    gradient: ["#f7971e", "#ffd200"]
    emoji: "🍿"
  - id: ocean
    gradient: ["#2193b0", "#6dd5ed"]
    emoji: "🌊"

tags:
  - key: classic
    title_key: collections.tags.classic
    domains: [music, film]
    search: [классика, classic]
  - key: nineties
    title_key: collections.tags.nineties
    domains: [music, film]
    search: [90-е, девяностые, 90s]
