[project]
name = "guessverse-social"
version = "0.1.0"
description = "Друзья, комментарии, жалобы, модерация, шкалы поведения и санкции, приватность"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth", "pyyaml>=6", "jsonschema>=4.23"]

[project.scripts]
social = "social_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_service"]
