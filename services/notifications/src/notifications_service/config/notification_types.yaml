# Типы уведомлений 5b (ADR 0047): маппинг «событие -> уведомление», каналы, шаблоны.
# Формат - contracts/notifications/notification_types.v1.json. Тексты и типы живут только здесь:
# новый тип - данные, не код. Нет шаблона на default_locale или плейсхолдер без параметра -
# сервис не стартует.
default_locale: ru
types:
  - key: level_up
    source_event: progression.ProgressionLevelChanged
    recipient: payload.user_id
    dedup_key: "level_up:{payload.user_id}:{payload.new_level}"
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      level: payload.new_level
    templates:
      ru:
        title: Новый уровень
        body: Вы достигли уровня {level}.

  - key: badge_unlocked
    source_event: progression.BadgeUnlocked
    recipient: payload.user_id
    dedup_key: "badge:{payload.user_id}:{payload.badge_key}"
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      badge: payload.badge_key
    templates:
      ru:
        title: Новый бейдж
        body: "Вы получили бейдж «{badge}»."

  - key: quest_completed
    source_event: progression.QuestCompleted
    recipient: payload.user_id
    dedup_key: "quest:{payload.user_id}:{payload.quest_key}:{payload.period_start}"
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      quest: payload.quest_key
    templates:
      ru:
        title: Задание выполнено
        body: "Задание «{quest}» выполнено, награда начислена."

  - key: weekly_top_reward
    source_event: progression.CurrencyCredited
    recipient: payload.user_id
    dedup_key: "weekly:{payload.op_id}"
    filter: {reason: weekly_top}
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      amount: payload.amount
    templates:
      ru:
        title: Награда недели
        body: За место в топе недели начислено {amount} Версов.

  - key: season_reward
    source_event: progression.CurrencyCredited
    recipient: payload.user_id
    dedup_key: "season:{payload.op_id}"
    filter: {reason: season}
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      amount: payload.amount
    templates:
      ru:
        title: Награда сезона
        body: За итог сезона начислено {amount} Версов.

  - key: avatar_approved
    source_event: media_pipeline.AssetModerated
    recipient: payload.owner_user_id
    dedup_key: "avatar:{payload.asset_id}:{payload.version}"
    filter: {purpose: avatar, status: approved}
    user_mutable: false
    channels: {in_app: true, email: false, push: false}
    params: {}
    templates:
      ru:
        title: Аватарка одобрена
        body: Ваша аватарка прошла модерацию.

  - key: avatar_rejected
    source_event: media_pipeline.AssetModerated
    recipient: payload.owner_user_id
    dedup_key: "avatar:{payload.asset_id}:{payload.version}"
    filter: {purpose: avatar, status: rejected}
    user_mutable: false
    channels: {in_app: true, email: false, push: false}
    params: {}
    # Коды причин - общий словарь с media-pipeline (AssetModerated.reason_code).
    lookups:
      reason:
        path: payload.reason_code
        texts:
          inappropriate: {ru: "отклонена: нарушает правила сообщества"}
          copyright: {ru: "отклонена: нарушает чужие авторские права"}
          low_quality: {ru: "отклонена: низкого качества"}
          personal_data: {ru: "отклонена: содержит личные данные"}
          other: {ru: "отклонена: не соответствует требованиям"}
        fallback: {ru: не прошла модерацию}
    templates:
      ru:
        title: Аватарка отклонена
        body: "Ваша аватарка {reason}."

  # --- 5c: social (ADR 0050, 0051). Только in-app и realtime, e-mail нет. ---
  - key: friend_request
    source_event: social.FriendRequested
    recipient: payload.to_user_id
    dedup_key: "friend_request:{payload.request_id}"
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      nickname: payload.from_nickname
    templates:
      ru:
        title: Заявка в друзья
        body: "{nickname} хочет добавить вас в друзья."

  - key: friend_accepted
    source_event: social.FriendAdded
    recipient: payload.requester_id
    dedup_key: "friend_accepted:{payload.user_a}:{payload.user_b}:{payload.at}"
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      nickname: payload.accepter_nickname
    templates:
      ru:
        title: Заявка принята
        body: "{nickname} теперь в вашем списке друзей."

  - key: room_invite
    source_event: social.RoomInviteSent
    recipient: payload.to_user_id
    dedup_key: "room_invite:{payload.invite_id}"
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      nickname: payload.from_nickname
    # Код комнаты клиент берёт из data, текст его не содержит.
    data:
      room_code: payload.room_code
    templates:
      ru:
        title: Приглашение в комнату
        body: "{nickname} зовёт вас в комнату."

  - key: report_resolved
    source_event: social.ReportResolved
    recipient: payload.reporter_id
    dedup_key: "report_resolved:{payload.report_id}"
    user_mutable: false
    channels: {in_app: true, email: false, push: false}
    params: {}
    templates:
      ru:
        title: Жалоба рассмотрена
        body: Мы рассмотрели вашу жалобу и приняли решение. Спасибо, что помогаете сообществу.

  - key: comment_on_my_collection
    source_event: social.CommentPosted
    recipient: payload.collection_author_id
    dedup_key: "comment:{payload.comment_id}"
    filter: {notify_owner: true}
    user_mutable: true
    channels: {in_app: true, email: false, push: false}
    params:
      nickname: payload.author_nickname
    templates:
      ru:
        title: Новый комментарий
        body: "{nickname} оставил(а) комментарий к вашему сборнику."
