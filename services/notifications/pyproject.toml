[project]
name = "guessverse-notifications"
version = "0.1.0"
description = "In-app уведомления, realtime-доставка, e-mail, web-push, отключение по типам"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth", "gv-email", "pyyaml>=6", "jsonschema>=4.23", "httpx>=0.28"]

[project.scripts]
notifications = "notifications_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications_service"]
