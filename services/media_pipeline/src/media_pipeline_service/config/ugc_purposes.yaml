# Назначения UGC-изображений и причины отклонения (5b, ADR 0048).
# Значений в коде нет: новое назначение = запись здесь + сервис-клиент в allowed_clients.
# Коды причин совпадают с contracts/notifications/notification_types.v1.json.
version: 1
purposes:
  avatar:
    # Лимит тела; на gateway client_max_body_size 2m, поэтому не больше 1_500_000.
    max_bytes: 1500000
    input_formats: [jpeg, png, webp]
    min_side_px: 128
    max_side_px: 4096
    # Результат: квадрат (центр-кроп) этой стороны, WebP без метаданных.
    output_side_px: 512
    allowed_clients: [progression]
reasons:
  - { code: inappropriate, title: Неприемлемое содержимое }
  - { code: copyright, title: Нарушение авторских прав }
  - { code: low_quality, title: Низкое качество }
  - { code: personal_data, title: Персональные данные }
  - { code: other, title: Другая причина }
