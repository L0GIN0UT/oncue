[project]
name = "guessverse-rating"
version = "0.1.0"
description = "Эло, калибровка, звания, сезоны, топы недели и сезона, лидерборды"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth", "pyyaml>=6"]

[project.scripts]
rating = "rating_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rating_service"]
