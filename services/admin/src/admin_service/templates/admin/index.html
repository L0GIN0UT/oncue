{% extends "admin/index.html" %}
{% block content %}
<div class="module">
  <table>
    <caption>Разделы Guessverse</caption>
    {% for entry in gv_menu %}
    <tr><th scope="row"><a href="{{ entry.url }}">{{ entry.title }}</a></th><td>{{ entry.description }}</td></tr>
    {% empty %}
    <tr><td>Нет доступных разделов</td></tr>
    {% endfor %}
  </table>
</div>
{{ block.super }}
{% endblock %}
