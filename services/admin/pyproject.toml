[project]
name = "guessverse-admin"
version = "0.1.0"
description = "Админ-панель (Django на этапе 1): модерация, контент, конфиги режимов; сейчас — заглушка"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth"]

[project.scripts]
admin = "admin_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_service"]
