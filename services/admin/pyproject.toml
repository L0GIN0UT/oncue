[project]
name = "guessverse-admin"
version = "0.1.0"
description = "Админ-панель (Django): модерация каталога и пользователей, загрузка исходников, аудит; мутации через admin-API сервисов"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth", "django>=5.2,<5.3", "psycopg[binary]>=3.2", "httpx>=0.28", "uvicorn>=0.32", "redis>=5.2", "cryptography>=44"]

[project.scripts]
admin = "admin_service.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_service"]
