[project]
name = "guessverse-progression"
version = "0.1.0"
description = "Опыт и уровни, валюта (журнал проводок), задания, бейджи, магазин, инвентарь, оформление профиля"
requires-python = ">=3.13"
dependencies = ["gv-core", "gv-db", "gv-messaging", "gv-service", "gv-auth"]

[project.scripts]
progression = "progression_service.main:run"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/progression_service"]
