# СГЕНЕРИРОВАНО `gv gen` из infra/services.toml — не редактировать вручную.
# Локальная разработка: порты сервисов на хосте и читаемые логи.
services:
  identity:
    ports: ["127.0.0.1:8100:8000"]
    environment:
      GV_LOG_JSON: "false"
      # Ссылки из писем ведут на веб-клиент за локальным gateway.
      GV_EMAIL__VERIFY_LINK: https://localhost/verify-email?token={token}
      GV_EMAIL__RESET_LINK: https://localhost/reset-password?token={token}
  catalog:
    ports: ["127.0.0.1:8101:8000"]
    environment:
      GV_LOG_JSON: "false"
      # Файлы импорта каталога (`gv dev seed`): воркер читает их из этого каталога.
      GV_IMPORTS__FILES_DIR: /seeds/catalog
      # Тексты загадок синтетического засева одобряются сразу (ТОЛЬКО local/ci, ADR 0024);
      # dev-оверлей — только local/ci, значение из .env имеет приоритет.
      GV_CATALOG__SEED_TEXTS_APPROVED: ${GV_CATALOG__SEED_TEXTS_APPROVED:-true}
    volumes:
      - ../../seeds/catalog:/seeds/catalog:ro
  media-pipeline:
    ports: ["127.0.0.1:8102:8000"]
    environment:
      GV_LOG_JSON: "false"
  game:
    ports: ["127.0.0.1:8103:8000"]
    environment:
      GV_LOG_JSON: "false"
      # Сиды режимов публикуются при старте (game.modes.bootstrap).
      GV_GAME__BOOTSTRAP_MODES_DIR: /seeds/game/modes
    volumes:
      - ../../seeds/game/modes:/seeds/game/modes:ro
  match:
    ports: ["127.0.0.1:8104:8000"]
    environment:
      GV_LOG_JSON: "false"
  rating:
    ports: ["127.0.0.1:8105:8000"]
    environment:
      GV_LOG_JSON: "false"
  collections:
    ports: ["127.0.0.1:8106:8000"]
    environment:
      GV_LOG_JSON: "false"
  library:
    ports: ["127.0.0.1:8107:8000"]
    environment:
      GV_LOG_JSON: "false"
  integrations:
    ports: ["127.0.0.1:8108:8000"]
    environment:
      GV_LOG_JSON: "false"
  progression:
    ports: ["127.0.0.1:8109:8000"]
    environment:
      GV_LOG_JSON: "false"
  payments:
    ports: ["127.0.0.1:8110:8000"]
    environment:
      GV_LOG_JSON: "false"
  social:
    ports: ["127.0.0.1:8111:8000"]
    environment:
      GV_LOG_JSON: "false"
  notifications:
    ports: ["127.0.0.1:8112:8000"]
    environment:
      GV_LOG_JSON: "false"
  bff-web:
    ports: ["127.0.0.1:8113:8000"]
    environment:
      GV_LOG_JSON: "false"
  admin:
    ports: ["127.0.0.1:8114:8000"]
    environment:
      GV_LOG_JSON: "false"
  # Bootstrap-админ автосидинга создаётся в job `migrate` identity (только local/ci).
  # Пусто (переменные не заданы) — функция выключена; значения берутся из .env.
  identity-migrate:
    environment:
      GV_BOOTSTRAP_ADMIN__LOGIN: ${GV_BOOTSTRAP_ADMIN__LOGIN:-}
      GV_BOOTSTRAP_ADMIN__PASSWORD: ${GV_BOOTSTRAP_ADMIN__PASSWORD:-}
