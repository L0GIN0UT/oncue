# СГЕНЕРИРОВАНО `gv gen` из infra/services.toml — не редактировать вручную.
# Запуск: см. infra/compose/README.md

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: infra/docker/python-service.Dockerfile
  restart: unless-stopped
  stop_grace_period: 30s
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
  healthcheck:
    test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

x-common-env: &common-env
  GV_ENVIRONMENT: ${GV_ENVIRONMENT:?задайте GV_ENVIRONMENT (local|staging|production)}
  GV_LOG_LEVEL: ${GV_LOG_LEVEL:-INFO}
  GV_OTLP_ENDPOINT: ${GV_OTLP_ENDPOINT:-}
  GV_JWKS_URL: http://identity:8000/.well-known/jwks.json
  GV_JWT_ISSUER: ${GV_JWT_ISSUER:-https://identity.guessverse.local}

services:
  # ---------------------------------------------------------------- identity
  # Аккаунты, вход, сессии и токены, привязка провайдеров, слияние и удаление аккаунтов, роли и права
  identity-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: identity, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/identity:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: identity
      GV_DATABASE_URL: postgresql+asyncpg://identity:${PG_PASSWORD_IDENTITY:?задайте PG_PASSWORD_IDENTITY}@postgres:5432/identity
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  identity:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: identity, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/identity:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: identity
      GV_DATABASE_URL: postgresql+asyncpg://identity:${PG_PASSWORD_IDENTITY:?задайте PG_PASSWORD_IDENTITY}@postgres:5432/identity
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      # Секрет токенов Centrifugo — свой у каждого сервиса (D9).
      GV_REALTIME__CONNECTION_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?задайте CENTRIFUGO_TOKEN_HMAC_SECRET}
      GV_PUBLIC_ORIGINS: ${GV_PUBLIC_ORIGINS:?задайте GV_PUBLIC_ORIGINS}
      GV_SERVICE_CLIENTS: ${GV_SERVICE_CLIENTS:-[]}
      # Пусто — временный ключ (только local/ci); вне них identity не стартует без ключей.
      GV_JWT__SIGNING_KEYS: ${GV_JWT__SIGNING_KEYS:-}
      # Коды из писем (ADR 0041): вне local/ci backend=smtp и ключ HMAC обязательны.
      GV_EMAIL__BACKEND: ${GV_EMAIL__BACKEND:-smtp}
      GV_EMAIL__SENDER: ${GV_EMAIL__SENDER:-Guessverse <no-reply@guessverse.local>}
      GV_EMAIL_CODE__HMAC_KEY: ${GV_EMAIL_CODE__HMAC_KEY:?задайте GV_EMAIL_CODE__HMAC_KEY}
      GV_SMTP__HOST: ${GV_SMTP__HOST:-localhost}
      GV_SMTP__PORT: ${GV_SMTP__PORT:-587}
      GV_SMTP__USERNAME: ${GV_SMTP__USERNAME:-}
      GV_SMTP__PASSWORD: ${GV_SMTP__PASSWORD:-}
      GV_SMTP__START_TLS: ${GV_SMTP__START_TLS:-true}
      GV_SMTP__USE_TLS: ${GV_SMTP__USE_TLS:-false}
      GV_SMTP__TIMEOUT_S: ${GV_SMTP__TIMEOUT_S:-10}
    depends_on:
      identity-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}
  # ---------------------------------------------------------------- catalog
  # Медиа-единицы (треки, фильмы, сериалы, аниме), персоны, франшизы, алиасы, поиск и автокомплит
  catalog-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: catalog, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/catalog:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: catalog
      GV_DATABASE_URL: postgresql+asyncpg://catalog:${PG_PASSWORD_CATALOG:?задайте PG_PASSWORD_CATALOG}@postgres:5432/catalog
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  catalog:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: catalog, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/catalog:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: catalog
      GV_DATABASE_URL: postgresql+asyncpg://catalog:${PG_PASSWORD_CATALOG:?задайте PG_PASSWORD_CATALOG}@postgres:5432/catalog
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      GV_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guessverse}:${RABBITMQ_PASSWORD:?задайте RABBITMQ_PASSWORD}@rabbitmq:5672/
      GV_CATALOG__TMDB_FRAMES_MAX: ${GV_CATALOG__TMDB_FRAMES_MAX:-6}
      GV_CATALOG__REPUBLISH_BATCH: ${GV_CATALOG__REPUBLISH_BATCH:-200}
      # Только local/ci: вне них catalog отказывается стартовать с true.
      GV_CATALOG__SEED_TEXTS_APPROVED: ${GV_CATALOG__SEED_TEXTS_APPROVED:-false}
    depends_on:
      catalog-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 320M}
  # ---------------------------------------------------------------- media_pipeline
  # Генерация ассетов загадок по уровням, хранение в S3, подписанные ссылки, проверка UGC-изображений
  media-pipeline-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: media_pipeline, APT_PACKAGES: "ffmpeg"}
    image: ${GV_REGISTRY:-guessverse}/media-pipeline:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: media_pipeline
      GV_DATABASE_URL: postgresql+asyncpg://media_pipeline:${PG_PASSWORD_MEDIA_PIPELINE:?задайте PG_PASSWORD_MEDIA_PIPELINE}@postgres:5432/media_pipeline
      GV_S3__ENDPOINT: http://s3:9000
      GV_S3__ACCESS_KEY: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY}
      GV_S3__SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  media-pipeline:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: media_pipeline, APT_PACKAGES: "ffmpeg"}
    image: ${GV_REGISTRY:-guessverse}/media-pipeline:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: media_pipeline
      GV_DATABASE_URL: postgresql+asyncpg://media_pipeline:${PG_PASSWORD_MEDIA_PIPELINE:?задайте PG_PASSWORD_MEDIA_PIPELINE}@postgres:5432/media_pipeline
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      GV_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guessverse}:${RABBITMQ_PASSWORD:?задайте RABBITMQ_PASSWORD}@rabbitmq:5672/
      GV_S3__ENDPOINT: http://s3:9000
      GV_S3__ACCESS_KEY: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY}
      GV_S3__SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
      GV_MEDIA__SIGNING_SECRET: ${GV_MEDIA__SIGNING_SECRET:?задайте GV_MEDIA__SIGNING_SECRET}
      GV_MEDIA__MAX_DYNAMIC_PROFILES: ${GV_MEDIA__MAX_DYNAMIC_PROFILES:-50}
      GV_MEDIA__BACKFILL_BATCH: ${GV_MEDIA__BACKFILL_BATCH:-200}
      GV_MEDIA__LINK_PURGE_INTERVAL_S: ${GV_MEDIA__LINK_PURGE_INTERVAL_S:-600}
    depends_on:
      media-pipeline-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      s3: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 768M}
  # ---------------------------------------------------------------- game
  # Соло-движок: сессии, раунды, ответы, очки; реестр плагинов загадок; конфиги режимов; дейлик, больше/меньше, топ-32
  game-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: game, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/game:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: game
      GV_DATABASE_URL: postgresql+asyncpg://game:${PG_PASSWORD_GAME:?задайте PG_PASSWORD_GAME}@postgres:5432/game
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  game:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: game, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/game:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: game
      GV_DATABASE_URL: postgresql+asyncpg://game:${PG_PASSWORD_GAME:?задайте PG_PASSWORD_GAME}@postgres:5432/game
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      GV_PUBLIC_ORIGINS: ${GV_PUBLIC_ORIGINS:?задайте GV_PUBLIC_ORIGINS}
      GV_GAME__DAILY_SEED_SECRET: ${GV_GAME__DAILY_SEED_SECRET:?задайте GV_GAME__DAILY_SEED_SECRET}
      GV_GAME__MEDIA_URL: http://media-pipeline:8000
      GV_GAME_LIMITS__PLAYABILITY_PER_MIN: ${GV_GAME_LIMITS__PLAYABILITY_PER_MIN:-30}
      GV_SERVICE_AUTH__TOKEN_URL: http://identity:8000/internal/v1/service-tokens
      GV_SERVICE_AUTH__CLIENT_ID: game
      GV_SERVICE_AUTH__CLIENT_SECRET: ${GV_SERVICE_SECRET_GAME:?задайте GV_SERVICE_SECRET_GAME}
    depends_on:
      game-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 320M}
  # ---------------------------------------------------------------- match
  # Онлайн: лобби, комнаты, матчмейкинг, конечный автомат матча, таймеры, реконнект, наблюдение
  match-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: match, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/match:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: match
      GV_DATABASE_URL: postgresql+asyncpg://match:${PG_PASSWORD_MATCH:?задайте PG_PASSWORD_MATCH}@postgres:5432/match
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  match:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: match, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/match:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: match
      GV_DATABASE_URL: postgresql+asyncpg://match:${PG_PASSWORD_MATCH:?задайте PG_PASSWORD_MATCH}@postgres:5432/match
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      # Centrifugo (D9 этапа 4): server API для публикаций — только публикующим сервисам.
      GV_REALTIME__API_URL: http://centrifugo:8000/api
      GV_REALTIME__API_KEY: ${CENTRIFUGO_API_KEY:?задайте CENTRIFUGO_API_KEY}
      # Секрет токенов Centrifugo — свой у каждого сервиса (D9).
      GV_REALTIME__SUBSCRIPTION_TOKEN_SECRET: ${CENTRIFUGO_SUBSCRIPTION_HMAC_SECRET:?задайте CENTRIFUGO_SUBSCRIPTION_HMAC_SECRET}
      GV_PUBLIC_ORIGINS: ${GV_PUBLIC_ORIGINS:?задайте GV_PUBLIC_ORIGINS}
      GV_SERVICE_AUTH__TOKEN_URL: http://identity:8000/internal/v1/service-tokens
      GV_SERVICE_AUTH__CLIENT_ID: match
      GV_SERVICE_AUTH__CLIENT_SECRET: ${GV_SERVICE_SECRET_MATCH:?задайте GV_SERVICE_SECRET_MATCH}
    depends_on:
      match-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 320M}
  # ---------------------------------------------------------------- rating
  # Эло, калибровка, звания, сезоны, топы недели и сезона, лидерборды
  rating-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: rating, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/rating:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: rating
      GV_DATABASE_URL: postgresql+asyncpg://rating:${PG_PASSWORD_RATING:?задайте PG_PASSWORD_RATING}@postgres:5432/rating
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  rating:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: rating, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/rating:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: rating
      GV_DATABASE_URL: postgresql+asyncpg://rating:${PG_PASSWORD_RATING:?задайте PG_PASSWORD_RATING}@postgres:5432/rating
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      rating-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}
  # ---------------------------------------------------------------- collections
  # Пользовательские и кураторские сборники: конструктор, черновики, каталог, лайки, избранное
  collections-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: collections, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/collections:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: collections
      GV_DATABASE_URL: postgresql+asyncpg://collections:${PG_PASSWORD_COLLECTIONS:?задайте PG_PASSWORD_COLLECTIONS}@postgres:5432/collections
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  collections:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: collections, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/collections:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: collections
      GV_DATABASE_URL: postgresql+asyncpg://collections:${PG_PASSWORD_COLLECTIONS:?задайте PG_PASSWORD_COLLECTIONS}@postgres:5432/collections
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      GV_PUBLIC_ORIGINS: ${GV_PUBLIC_ORIGINS:?задайте GV_PUBLIC_ORIGINS}
      GV_COLLECTIONS__LIMITS__DRAFTS_MAX: ${GV_COLLECTIONS__LIMITS__DRAFTS_MAX:-20}
      GV_COLLECTIONS__LIMITS__PUBLISH_PER_DAY: ${GV_COLLECTIONS__LIMITS__PUBLISH_PER_DAY:-5}
      GV_COLLECTIONS__LIMITS__ITEMS_MIN: ${GV_COLLECTIONS__LIMITS__ITEMS_MIN:-5}
      GV_COLLECTIONS__LIMITS__ITEMS_MAX: ${GV_COLLECTIONS__LIMITS__ITEMS_MAX:-200}
      GV_COLLECTIONS__LIMITS__TAGS_MAX: ${GV_COLLECTIONS__LIMITS__TAGS_MAX:-5}
      GV_COLLECTIONS__DIFFICULTY__PRIOR: ${GV_COLLECTIONS__DIFFICULTY__PRIOR:-0.5}
      GV_COLLECTIONS__DIFFICULTY__M: ${GV_COLLECTIONS__DIFFICULTY__M:-10}
      GV_COLLECTIONS__DIFFICULTY__MIN_PLAYS: ${GV_COLLECTIONS__DIFFICULTY__MIN_PLAYS:-10}
      GV_COLLECTIONS__DIFFICULTY__THRESHOLDS: ${GV_COLLECTIONS__DIFFICULTY__THRESHOLDS:-[0.4,0.7]}
      # Пусто — встроенный denylist gv_text; свой файл нужно смонтировать в контейнер.
      GV_UGC__DENYLIST_PATH: ${GV_UGC__DENYLIST_PATH:-}
    depends_on:
      collections-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}
  # ---------------------------------------------------------------- library
  # Личная медиатека: плейлисты, «смотреть позже», «просмотрено», «любимое»
  library-migrate:
    <<: *python-service
