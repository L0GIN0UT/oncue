    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: library
      GV_DATABASE_URL: postgresql+asyncpg://library:${PG_PASSWORD_LIBRARY:?задайте PG_PASSWORD_LIBRARY}@postgres:5432/library
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  library:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: library, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/library:${GV_TAG:-local}
    command: ["all"]
    environment:
      <<: *common-env
      GV_SERVICE_NAME: library
      GV_DATABASE_URL: postgresql+asyncpg://library:${PG_PASSWORD_LIBRARY:?задайте PG_PASSWORD_LIBRARY}@postgres:5432/library
      GV_DATABASE_POOL_SIZE: "5"
      GV_REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD}@redis:6379/0
      GV_KAFKA_BOOTSTRAP: redpanda:9092
      GV_PUBLIC_ORIGINS: ${GV_PUBLIC_ORIGINS:?задайте GV_PUBLIC_ORIGINS}
      # Пусто — встроенный config/shelves.yaml; свой файл нужно смонтировать в контейнер.
      GV_LIBRARY__SHELVES_CONFIG: ${GV_LIBRARY__SHELVES_CONFIG:-}
      GV_LIBRARY__LIMITS__CUSTOM_SHELVES_MAX: ${GV_LIBRARY__LIMITS__CUSTOM_SHELVES_MAX:-50}
      GV_LIBRARY__LIMITS__SAVES_PER_MIN: ${GV_LIBRARY__LIMITS__SAVES_PER_MIN:-60}
      # Пусто — встроенный denylist gv_text; свой файл нужно смонтировать в контейнер.
      GV_UGC__DENYLIST_PATH: ${GV_UGC__DENYLIST_PATH:-}
    depends_on:
      library-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}
  # ---------------------------------------------------------------- integrations
  # Адаптеры внешних провайдеров, шифрованные токены, синхронизация и импорт
  integrations-migrate:
    <<: *python-service
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: {SERVICE: integrations, APT_PACKAGES: ""}
    image: ${GV_REGISTRY:-guessverse}/integrations:${GV_TAG:-local}
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    environment:
      <<: *common-env
      GV_SERVICE_NAME: integrations
      GV_DATABASE_URL: postgresql+asyncpg://integrations:${PG_PASSWORD_INTEGRATIONS:?задайте PG_PASSWORD_INTEGRATIONS}@postgres:5432/integrations
    depends_on:
      postgres: {condition: service_healthy}
