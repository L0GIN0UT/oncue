# Инфраструктура Guessverse: хранилища, брокеры, realtime, фича-флаги.
# Версии образов закреплены явно; обновлять осознанно и проверять тегом в реестре.
name: guessverse

networks:
  backend:
    name: guessverse_backend

volumes:
  pgdata:
  redisdata:
  redpandadata:
  rabbitmqdata:
  opensearchdata:
  s3data:

# Ключи доступа к S3 (SeaweedFS читает их из файла; значения — из .env, `gv dev secrets`).
configs:
  s3_identities:
    content: |
      {"identities": [{"name": "app", "credentials": [{"accessKey": "${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY:?задайте S3_SECRET_KEY}"}], "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    # Пароли БД сервисов нужны init-скрипту (генерируется `gv gen`).
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=300   # 15 сервисов × пул (5 + 5) + админка и запас
      - -c
      - shared_buffers=512MB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 3G}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD}
    # noeviction: в Redis живут игровые сессии и комнаты — их нельзя молча вытеснять.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --maxmemory 768mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1G}

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    # --mode dev-container — официальный режим Redpanda для контейнеров (v24.3):
    #   сам включает overprovisioned, reserve-memory=0, отключает fsync и проверки
    #   окружения, разрешает авто-создание топиков. Отдельные флаги --overprovisioned
    #   и --reserve-memory в v24.3 убраны (свёрнуты в этот режим) — передача их по
    #   отдельности роняет брокер на старте. См. docs.redpanda.com rpk redpanda start.
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1536M}

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guessverse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?задайте RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits: {memory: 512M}

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      # Доступен только во внутренней сети backend, порт наружу не публикуется.
      # При выносе в отдельный кластер — включить security plugin и TLS.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits: {memory: 2G}

  # S3-совместимое хранилище исходников и ассетов — SeaweedFS (ADR 0021): MinIO снял
  # образы из публичных реестров и прекратил community-сборки. Сервисы работают через
  # стандартный S3 API, поэтому хранилище заменяемо (облачный S3, Garage) без правки кода.
  # Бакеты и политику бакета ассетов создаёт `media-pipeline-migrate` (prepare_resources).
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    # Официальный entrypoint понижает права до пользователя seaweed и добавляет
    # -dir=/data -volume.max=0; ниже — только наши параметры:
    #   -ip.bind=127.0.0.1 — master/filer/volume слушают только loopback внутри
    #     контейнера: по сети backend к ним не подключиться в обход ключей S3 и
    #     политики бакета (их HTTP/gRPC не требуют аутентификации). Наружу открыт
    #     только S3 (-s3.ip.bind=0.0.0.0), и то лишь порт 9000 — см. ADR 0021;
    #   -s3.port.iceberg=0 -s3.port.lance=0 — REST-каталоги Iceberg/Lance не нужны;
    #   -master.volumeSizeLimitMB — небольшие тома (ассеты мелкие, диск VPS ограничен);
    #   -s3.iam=false — ключи только из конфига ниже (встроенный STS-IAM не нужен).
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=256
      - -master.telemetry=false
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
        mode: 0444
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 512M}

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    # Namespace-ы, права и лимиты — в infra/centrifugo/config.json (D9 этапа 4); секреты —
    # только из env (переменные CENTRIFUGO_* перекрывают файл).
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    volumes:
      - ../centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?задайте CENTRIFUGO_API_KEY}
      # connection-токены подписывает identity, subscription-токены комнат — match: секреты
      # разные (client.token / client.subscription_token, subscription_token.enabled=true).
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?задайте CENTRIFUGO_TOKEN_HMAC_SECRET}
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SUBSCRIPTION_HMAC_SECRET:?задайте CENTRIFUGO_SUBSCRIPTION_HMAC_SECRET}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:?задайте CENTRIFUGO_ALLOWED_ORIGINS}
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://:${REDIS_PASSWORD}@redis:6379/1
      CENTRIFUGO_HEALTH_ENABLED: "true"
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256M}

  unleash:
    image: unleashorg/unleash-server:6
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      DATABASE_URL: postgres://unleash:${PG_PASSWORD_UNLEASH:?задайте PG_PASSWORD_UNLEASH}@postgres:5432/unleash
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "*:*.${UNLEASH_ADMIN_TOKEN:?задайте UNLEASH_ADMIN_TOKEN}"
      LOG_LEVEL: warn
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 384M}
