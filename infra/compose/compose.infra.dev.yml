# Локальная разработка: порты инфраструктуры только на 127.0.0.1 (наружу не торчат).
services:
  postgres: {ports: ["127.0.0.1:5432:5432"]}
  redis: {ports: ["127.0.0.1:6379:6379"]}
  redpanda: {ports: ["127.0.0.1:9092:9092"]}
  rabbitmq: {ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]}
  opensearch: {ports: ["127.0.0.1:9200:9200"]}
  s3: {ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]}
  centrifugo: {ports: ["127.0.0.1:8800:8000"]}
  unleash: {ports: ["127.0.0.1:4242:4242"]}
