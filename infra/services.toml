# Реестр сервисов Guessverse — ЕДИНЫЙ источник истины о составе системы.
#
# Из этого файла `gv gen` генерирует:
#   infra/compose/compose.services.yml        — сервисы в docker-compose
#   infra/compose/postgres/10-service-databases.sh — БД и пользователь на каждый сервис
#   infra/compose/.env.example                — переменные окружения
#   infra/nginx/generated/{upstreams,routes}.conf — маршрутизация gateway
#   infra/observability/prometheus/services.yml — цели сбора метрик
#   .importlinter                             — правила слоёв и независимости сервисов
#
# Руками сгенерированные файлы не правим: изменить реестр → `gv gen` → закоммитить всё вместе.
# CI проверяет актуальность командой `gv gen --check`.
#
# Поля сервиса:
#   description  — назначение (попадает в OpenAPI и CLAUDE.md сервиса)
#   public       — префикс публичного API на gateway: /api/<public>/v1/... ("" — не публикуется)
#   database     — своя БД PostgreSQL
#   redis        — использует Redis
#   kafka        — публикует/читает доменные события (relay + consumer)
#   rabbitmq     — фоновые задачи
#   memory_mb    — лимит памяти контейнера

[services.identity]
description = "Аккаунты, вход, сессии и токены, привязка провайдеров, слияние и удаление аккаунтов, роли и права"
public = "identity"
database = true
redis = true
kafka = true
rabbitmq = false
memory_mb = 256

[services.catalog]
description = "Медиа-единицы (треки, фильмы, сериалы, аниме), персоны, франшизы, алиасы, поиск и автокомплит"
