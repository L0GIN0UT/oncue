# Gateway Guessverse. Маршруты сервисов — generated/{upstreams,routes}.conf (генерирует `gv gen`).
# Секреты (ключ подписи ссылок /media/) подставляются шаблонами официального образа:
# templates/*.template → envsubst → /etc/nginx/conf.d/*.conf (compose.gateway.yml).
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;          # загрузка изображений пойдёт отдельными presigned-ссылками в S3
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Docker DNS: имена сервисов пересчитываются при перезапуске контейнеров.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Структурированный лог: Filebeat отправляет его в Elasticsearch.
    # $uri, а не $request_uri: query подписанных ссылок (md5, expires) в лог не попадает.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_duration":"$upstream_response_time",'
        '"cache":"$upstream_cache_status",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Rate limit по IP (защита от перебора и всплесков). Тонкие лимиты по пользователю —
    # в сервисах (Redis), т.к. gateway не знает пользователя.
    limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=20r/s;
    # Вход, регистрация, сброс пароля: перебор паролей и спам письмами. Точные лимиты по IP и
    # аккаунту — в identity; здесь грубый внешний барьер, который не пускает поток до сервиса.
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
    # Отдельная зона для установки realtime-соединений (WebSocket и HTTP-stream): дорогие,
    # частыми быть не должны. Этап 4a: 5 r/s + burst 20 — за одним NAT бывает вся party
    # (до 6 игроков), а после рестарта Centrifugo все клиенты переподключаются разом, и
    # каждый может сделать две попытки (WebSocket, затем фолбэк HTTP-stream).
    limit_req_zone $binary_remote_addr zone=ws_per_ip:10m rate=5r/s;
    # Выдача ассетов по подписанным ссылкам: уровень загадки — несколько объектов в минуту.
    limit_req_zone $binary_remote_addr zone=media_per_ip:10m rate=20r/s;
    limit_req_status 429;

    # Кэш ассетов вместо CDN (ADR 0012). Ключ — только путь: query (md5, expires) у каждой
    # выдачи свой, с ним кэш не попадал бы никогда. Подпись проверяется ДО обращения к кэшу.
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=2g
                     inactive=30m use_temp_path=off;

    # TLS: профиль Mozilla intermediate (TLS 1.2 + 1.3).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    # Тикеты выключены: ключ тикетов не ротируется без перезапуска и ломает forward secrecy.
    ssl_session_tickets off;

    # Переменные из шаблонов (секрет подписи ссылок, бакет ассетов).
    include /etc/nginx/conf.d/*.conf;

    include /etc/nginx/generated/upstreams.conf;

    upstream gv_centrifugo {
        zone gv_centrifugo 64k;
        server centrifugo:8000 resolve max_fails=3 fail_timeout=10s;
    }

    # Приватное S3-хранилище (SeaweedFS, ADR 0021) во внутренней сети: наружу не
    # публикуется, gateway читает только префикс a/ бакета ассетов — анонимное чтение a/*
    # разрешено политикой бакета, которую ставит media-pipeline-migrate.
    upstream gv_s3 {
        zone gv_s3 64k;
        server s3:9000 resolve max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    # Веб-клиент (Next.js, infra/compose/compose.web.yml).
    upstream gv_web {
        zone gv_web 64k;
        server web:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------ :80 → https
    server {
        listen 80 default_server;
        server_name _;

        # HTTP-01 для certbot (webroot). Только этот путь отвечает по http.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        # Healthcheck контейнера (из сети docker, не снаружи — порт 80 отвечает только 301).
        location = /healthz {
            access_log off;
            allow 127.0.0.1;
            deny all;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------ :443
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # OCSP stapling: работает, если у сертификата есть OCSP-респондер (у Let's Encrypt
        # его больше нет — тогда директива просто ничего не делает).
        ssl_stapling on;
        ssl_stapling_verify on;

        include /etc/nginx/snippets/security-headers.conf;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Realtime: фолбэк-транспорт HTTP-stream (сети, где режется WebSocket). Длинный
        # потоковый ответ: без буферизации, иначе клиент не получит сообщения до закрытия.
        location = /connection/http_stream {
            limit_except POST { deny all; }
            limit_req zone=ws_per_ip burst=20 nodelay;
            proxy_pass http://gv_centrifugo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header X-Request-Id $request_id;
        }

        # Команды клиента при HTTP-stream (bidirectional emulation): Centrifugo слушает их на
        # /emulation; клиенту задаётся emulationEndpoint=/connection/emulation. Короткие
        # запросы — общий лимит API, а не лимит установки соединений.
        location = /connection/emulation {
            limit_except POST { deny all; }
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://gv_centrifugo/emulation;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            proxy_set_header X-Request-Id $request_id;
        }

        # Realtime: WebSocket к Centrifugo.
        location /connection/ {
            limit_req zone=ws_per_ip burst=20 nodelay;
            proxy_pass http://gv_centrifugo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_set_header X-Request-Id $request_id;
        }

        # Вход, регистрация, refresh, сброс пароля — свой лимит поверх общего.
        location ^~ /api/identity/v1/auth/ {
            limit_req zone=auth_per_ip burst=10 nodelay;
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://gv_identity/v1/auth/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # Ассеты загадок по подписанным ссылкам (ADR 0012):
        #   /media/a/<ключ>.<ext>?md5=<base64url(md5("<expires><uri> <секрет>"))>&expires=<unix>
        # Подпись выдаёт media-pipeline (NginxSecureLinkSigner) тем же секретом.
        location ^~ /media/ {
            # Только объекты ассетов: a/<случайный ключ>.<расширение>. Всё остальное в бакете
            # (исходники, служебные объекты) через gateway недоступно.
            location ~ "^/media/(a/[A-Za-z0-9_-]+\.[a-z0-9]{2,5})$" {
                limit_except GET { deny all; }
                limit_req zone=media_per_ip burst=40 nodelay;

                # Пустой секрет = подпись без секрета, её подделает кто угодно: закрываемся.
                if ($media_signing_secret = "") { return 503; }
                secure_link $arg_md5,$arg_expires;
                secure_link_md5 "$secure_link_expires$uri $media_signing_secret";
                # "" — подпись неверна, "0" — ссылка истекла. Оба — 403 (план этапа 1, §0 п.4).
                if ($secure_link = "") { return 403; }
                if ($secure_link = "0") { return 403; }

                # URI с переменными: query клиента (md5, expires и любые S3-параметры вроде
                # ?acl) в хранилище не передаётся.
                proxy_pass http://gv_s3/$media_assets_bucket/$1;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_connect_timeout 2s;
                proxy_read_timeout 15s;

                proxy_cache media;
                proxy_cache_key $uri;
                proxy_cache_valid 200 30m;
                proxy_cache_valid 404 10s;
                proxy_cache_lock on;
                proxy_ignore_headers Set-Cookie Cache-Control Expires;
                proxy_hide_header Set-Cookie;
                proxy_hide_header x-amz-request-id;
                proxy_hide_header x-amz-id-2;
                proxy_hide_header X-Amz-Bucket-Region;
                proxy_hide_header Server;
                proxy_hide_header Cache-Control;
                proxy_hide_header ETag;

                # add_header в location отменяет унаследованные — подключаем общие заново.
                include /etc/nginx/snippets/security-headers.conf;
                add_header Cache-Control "private, max-age=60" always;
            }

            # UGC на модерации (ADR 0048): p/<128 бит hex>.webp, только по подписанной ссылке
            # модератора (тем же секретом), без кэша gateway и браузера: после решения объект
            # удаляется, а кэш не должен его пережить.
            location ~ "^/media/(p/[a-f0-9]{32}\.webp)$" {
                limit_except GET { deny all; }
                limit_req zone=media_per_ip burst=40 nodelay;

                if ($media_signing_secret = "") { return 503; }
                secure_link $arg_md5,$arg_expires;
                secure_link_md5 "$secure_link_expires$uri $media_signing_secret";
                if ($secure_link = "") { return 403; }
                if ($secure_link = "0") { return 403; }

                proxy_pass http://gv_s3/$media_assets_bucket/$1;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_connect_timeout 2s;
                proxy_read_timeout 15s;

                proxy_no_cache 1;
                proxy_cache_bypass 1;
                proxy_ignore_headers Set-Cookie Cache-Control Expires;
                proxy_hide_header Set-Cookie;
                proxy_hide_header x-amz-request-id;
                proxy_hide_header x-amz-id-2;
                proxy_hide_header X-Amz-Bucket-Region;
                proxy_hide_header Server;
                proxy_hide_header Cache-Control;
                proxy_hide_header ETag;

                include /etc/nginx/snippets/security-headers.conf;
                add_header Cache-Control "private, no-store" always;
            }

            return 404;
        }

        # Одобренные UGC-изображения (аватарки, ADR 0048): публичный префикс, только объекты
        # u/<128 бит hex>.webp. Ключ случайный и при каждом одобрении новый; снятое
        # изображение удаляется из бакета, поэтому кэш короткий и у gateway (proxy_cache_valid
        # 1m), и у браузера (max-age=60): снятое изображение пропадает не позже чем через минуту.
        location ^~ /ugc/ {
            location ~ "^/ugc/(u/[a-f0-9]{32}\.webp)$" {
                limit_except GET { deny all; }
                limit_req zone=media_per_ip burst=40 nodelay;

                proxy_pass http://gv_s3/$media_assets_bucket/$1;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_connect_timeout 2s;
                proxy_read_timeout 15s;

                proxy_cache media;
                proxy_cache_key $uri;
                proxy_cache_valid 200 1m;
                proxy_cache_valid 404 10s;
                proxy_cache_lock on;
                proxy_ignore_headers Set-Cookie Cache-Control Expires;
                proxy_hide_header Set-Cookie;
                proxy_hide_header x-amz-request-id;
                proxy_hide_header x-amz-id-2;
                proxy_hide_header X-Amz-Bucket-Region;
                proxy_hide_header Server;
                proxy_hide_header Cache-Control;
                proxy_hide_header ETag;

                include /etc/nginx/snippets/security-headers.conf;
                add_header Cache-Control "public, max-age=60" always;
            }

            return 404;
        }

        # Косметика (ADR 0046): публичный префикс, косметика не секрет. Только объекты вида
        # c/<128 бит hex>.<webp|png>; ключ случайный и при замене картинки меняется, поэтому
        # кэш бессрочный. Анонимное чтение префикса c/ разрешено политикой бакета косметики.
        location ^~ /cosmetics/ {
            location ~ "^/cosmetics/(c/[a-f0-9]{32}\.(?:webp|png))$" {
                limit_except GET { deny all; }
                limit_req zone=media_per_ip burst=40 nodelay;

                proxy_pass http://gv_s3/$cosmetics_bucket/$1;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Authorization "";
                proxy_set_header Cookie "";
                proxy_connect_timeout 2s;
                proxy_read_timeout 15s;

                proxy_cache media;
                proxy_cache_key $uri;
                proxy_cache_valid 200 1d;
                proxy_cache_valid 404 10s;
                proxy_cache_lock on;
                proxy_ignore_headers Set-Cookie Cache-Control Expires;
                proxy_hide_header Set-Cookie;
                proxy_hide_header x-amz-request-id;
                proxy_hide_header x-amz-id-2;
                proxy_hide_header X-Amz-Bucket-Region;
                proxy_hide_header Server;
                proxy_hide_header Cache-Control;
                proxy_hide_header ETag;

                include /etc/nginx/snippets/security-headers.conf;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }

            return 404;
        }

        include /etc/nginx/generated/routes.conf;

        # Неизвестный путь API — JSON 404, а не страница веб-клиента.
        location ^~ /api/ {
            default_type application/problem+json;
            return 404 '{"type":"urn:guessverse:problem:route.not_found","title":"Not found","status":404,"code":"route.not_found"}';
        }

        # Страницы веб-клиента. CSP с nonce ставит Next; общий CSP gateway (default-src 'none')
        # здесь не подходит, поэтому свой набор заголовков без CSP.
        location / {
            proxy_pass http://gv_web;
            include /etc/nginx/snippets/proxy.conf;
            proxy_hide_header X-Powered-By;
            include /etc/nginx/snippets/web-headers.conf;
        }

        # Статика сборки Next: имена с хэшем содержимого — кэш на год.
        location ^~ /_next/static/ {
            proxy_pass http://gv_web;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/web-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_hide_header Cache-Control;
        }
    }
}
