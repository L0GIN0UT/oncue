# Gateway Guessverse. Маршруты сервисов — conf.d/services.conf (генерируется `gv gen`).
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;          # загрузка изображений пойдёт отдельными presigned-ссылками в S3
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Docker DNS: имена сервисов пересчитываются при перезапуске контейнеров.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Структурированный лог: Filebeat отправляет его в Elasticsearch.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_duration":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Rate limit по IP (защита от перебора и всплесков). Тонкие лимиты по пользователю —
    # в сервисах (Redis), т.к. gateway не знает пользователя.
    limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=20r/s;
    # Отдельная зона для установки WebSocket-соединений: дорогие, частыми быть не должны.
    limit_req_zone $binary_remote_addr zone=ws_per_ip:10m rate=2r/s;
    limit_req_status 429;

    include /etc/nginx/generated/upstreams.conf;

    upstream gv_centrifugo {
        zone gv_centrifugo 64k;
        server centrifugo:8000 resolve max_fails=3 fail_timeout=10s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS включается на TLS-сервере (после настройки сертификатов).

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Realtime: WebSocket к Centrifugo.
        location /connection/ {
            limit_req zone=ws_per_ip burst=10 nodelay;
            proxy_pass http://gv_centrifugo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_set_header X-Request-Id $request_id;
        }

        include /etc/nginx/generated/routes.conf;

        location / {
            default_type application/problem+json;
            return 404 '{"type":"urn:guessverse:problem:route.not_found","title":"Not found","status":404,"code":"route.not_found"}';
        }
    }
}
