# Заголовки безопасности для страниц веб-клиента (location /). Без CSP: политику с nonce
# на каждый ответ ставит сам Next (frontend/src/proxy.ts). Подключается в location с
# собственными add_header, поэтому общий набор повторён здесь.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
