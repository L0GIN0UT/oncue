# Заголовки безопасности для HTTPS-сервера. Подключается в server {} и заново в каждом
# location с собственным add_header (иначе nginx не наследует заголовки уровня server).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Gateway отдаёт только API (JSON) и ассеты: странице здесь нечего загружать и встраивать.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
