# То же, что web-headers.conf, но Referrer-Policy: no-referrer. Для страниц, адрес которых несёт
# одноразовый секрет в query (отписка от рассылки /unsubscribe?token=…): адрес не должен уходить
# в Referer ни на какой другой ресурс. Подключается в location с собственными add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control "private, no-store" always;
