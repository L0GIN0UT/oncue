# Общие настройки проксирования к сервисам.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Real-IP $remote_addr;
# Gateway — граница доверия: клиентский X-Forwarded-For не пробрасываем (подмена IP для
# rate-limit и аудита). Если перед gateway появится балансировщик/CDN — настроить real_ip.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
# Повтор на другой инстанс — только для идемпотентных методов и только при ошибке соединения.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
