<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Игра: дейлик</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1A1A}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A6A;font-weight:600}
.ib{width:40px;height:40px;border-radius:999px;border:1.5px solid #474747;background:#242424;color:#ABABAB;display:grid;place-items:center;cursor:pointer;text-decoration:none;padding:0}
.ib:hover{color:#F2F2F2;border-color:#6A6A6A}
.pillbtn{height:40px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid #474747;background:#242424;color:#F2F2F2;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.pillbtn:hover{border-color:#6A6A6A}
.row{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;box-sizing:border-box;border:1.5px solid #474747;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.rtab{flex:1;height:34px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:600;box-sizing:border-box;border:1.5px solid #474747}
@keyframes pop{0%{transform:scale(.985);opacity:.6}100%{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 6px rgba(242,177,59,.14)}100%{box-shadow:0 0 0 28px rgba(242,177,59,0)}}
@keyframes sweep{0%{width:0}100%{width:100%}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes modal{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
.play{width:88px;height:88px;border-radius:999px;border:0;background:#F2B13B;color:#1A1A1A;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 6px rgba(242,177,59,.14);transition:transform .15s;padding:0}
.play:hover{transform:scale(1.04)}
.play.live{animation:pulse 1.1s ease-out infinite}
.btn{font:inherit;font-weight:600;font-size:16px;height:56px;padding:0 24px;border-radius:14px;cursor:pointer;border:1.5px solid #474747;background:#242424;color:#F2F2F2;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:#6A6A6A}
.btn.go{background:#F2B13B;border-color:#F2B13B;color:#1A1A1A}
.btn.give{background:#7A3838;border-color:#7A3838;color:#FFFFFF}
.btn.mid{height:50px;font-size:15px}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#1A1A1A}
.ph{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35);width:0}
.ph.live{animation:sweep linear forwards}
.dd{position:absolute;left:0;right:0;bottom:64px;background:#242424;border:1.5px solid #474747;border-radius:14px;overflow:hidden;animation:rise .18s cubic-bezier(.2,.8,.2,1);z-index:5}
.opt{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;color:#F2F2F2;font:inherit;font-size:15px;padding:12px 16px;cursor:pointer;text-align:left}
.opt:hover{background:#2E2E2E}
.art{position:relative;overflow:hidden;display:grid;place-items:center;color:#6A6A6A}
@media (prefers-reduced-motion: reduce){.row,.play.live,.ph.live,.dd{animation:none}.play{transition:none}}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box; position: relative">

  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 1; display: flex; align-items: center; gap: 8px">
      <a href="Home.dc.html" class="pillbtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Выйти</a>
      <button class="ib" type="button" onClick="{{toggleMute}}" aria-label="{{muteLabel}}">
        <sc-if value="{{sound}}" hint-placeholder-val="{{true}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></sc-if>
        <sc-if value="{{muted}}" hint-placeholder-val="{{false}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg></sc-if>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span class="h" style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">Guessverse</span>
      <span class="cap">Дейлик · музыка · 26 октября</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <span style="display: inline-flex; align-items: baseline; gap: 6px"><span class="h" style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">{{score}}</span><span class="h" style="font-size: 15px; font-weight: 500; color: #6A6A6A">/ {{maxScore}}</span></span>
      <span class="cap">очки</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 10px 24px 48px; box-sizing: border-box">
    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <ol aria-label="Раунды" style="list-style: none; margin: 0 0 6px; padding: 0; display: flex; gap: 8px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <li class="rtab" aria-label="{{t.aria}}" style="background: {{t.bg}}; border-color: {{t.bd}}; color: {{t.fg}}">{{t.label}}</li>
        </sc-for>
      </ol>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="row" style="background: {{r.bg}}; border-color: {{r.bd}}; box-shadow: {{r.sh}}; justify-content: {{r.jc}}">
          <span style="color: {{r.fg}}">{{r.text}}</span>
          <sc-if value="{{r.check}}" hint-placeholder-val="{{false}}"><svg class="ico" viewBox="0 0 24 24" role="img" aria-label="Угадал" style="color:#9BE39F"><path d="M5 12l5 5L20 7"/></svg></sc-if>
          <sc-if value="{{r.cross}}" hint-placeholder-val="{{false}}"><svg class="ico" viewBox="0 0 24 24" role="img" aria-label="Мимо" style="color:#F2A0A0"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if>
          <sc-if value="{{r.note}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #F2B13B; font-weight: 600">исполнитель верный</span></sc-if>
        </div>
      </sc-for>
    </section>

    <section style="width: 100%; max-width: 640px; position: relative; padding-top: 30px">
      <span class="h" style="position: absolute; top: 0; left: {{markerPct}}; transform: translateX(-50%); font-size: 14px; font-weight: 500; color: #F2B13B; white-space: nowrap; transition: left .4s cubic-bezier(.2,.8,.2,1)">{{openSec}} с</span>
      <span style="position: absolute; top: 20px; left: {{markerPct}}; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #F2B13B; transition: left .4s cubic-bezier(.2,.8,.2,1)"></span>
      <div style="position: relative; height: 16px; border-radius: 8px; background: #333333; border: 1.5px solid #474747; overflow: hidden">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{markerPct}}; background: #F2B13B; transition: width .4s cubic-bezier(.2,.8,.2,1)"><span class="ph {{liveCls}}" style="animation-duration: {{playDur}}s"></span></span>
        <span class="tick" style="left: 6.25%"></span><span class="tick" style="left: 12.5%"></span><span class="tick" style="left: 25%"></span><span class="tick" style="left: 43.75%"></span><span class="tick" style="left: 68.75%"></span>
      </div>
    </section>

    <button class="play {{liveCls}}" type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}">
      <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:34px;height:34px"><path d="M8 5v14M16 5v14"/></svg></sc-if>
      <sc-if value="{{idle}}" hint-placeholder-val="{{true}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px;margin-left:4px"><path d="M7 5v14l12-7z"/></svg></sc-if>
    </button>

    <form style="width: 100%; max-width: 640px; display: flex; gap: 10px; position: relative" onSubmit="{{submit}}">
      <label for="guess" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Твой ответ</label>
      <sc-if value="{{showDd}}" hint-placeholder-val="{{false}}">
        <div class="dd" role="listbox" aria-label="Подсказки">
          <sc-for list="{{matches}}" as="m" hint-placeholder-count="3">
            <button class="opt" type="button" onClick="{{m.pick}}" role="option" aria-selected="false"><span>{{m.title}} — <b>{{m.artist}}</b></span><span style="color: #ABABAB; font-size: 13px">{{m.year}}</span></button>
          </sc-for>
        </div>
      </sc-if>
      <div style="flex: 1; position: relative; display: flex; align-items: center">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 16px; color: #ABABAB"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="guess" type="text" placeholder="Название трека или исполнитель" autocomplete="off" value="{{q}}" onInput="{{onInput}}" style="width: 100%; height: 56px; border-radius: 14px; border: 1.5px solid {{inpBd}}; background: #242424; color: #F2F2F2; padding: 0 44px 0 48px; font: inherit; font-size: 16px; box-sizing: border-box; outline: none">
        <sc-if value="{{hasQ}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{clear}}" aria-label="Очистить" style="position: absolute; right: 8px; width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; color: #ABABAB; cursor: pointer; display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></sc-if>
      </div>
      <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}"><button class="btn go" type="submit">Ответить</button></sc-if>
      <sc-if value="{{showSkip}}" hint-placeholder-val="{{true}}"><button class="btn" type="button" onClick="{{skip}}">Пропустить</button></sc-if>
      <sc-if value="{{showGive}}" hint-placeholder-val="{{false}}"><button class="btn give" type="button" onClick="{{giveUp}}">Сдаться</button></sc-if>
    </form>
  </main>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
      <div role="dialog" aria-label="Ответ раунда" style="width: 100%; max-width: 440px; background: #242424; border: 1.5px solid #474747; border-radius: 20px; overflow: hidden; animation: modal .25s cubic-bezier(.2,.8,.2,1)">
        <div class="h" style="padding: 14px 16px; background: {{headBg}}; color: {{headFg}}; font-size: 17px; font-weight: 800; text-align: center">{{headText}}</div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: center">
          <div class="art" style="width: 220px; height: 220px; border-radius: 14px; overflow: hidden; background: #2E2E2E"><img src="/_blob/a2fe74f4ed1c52b41bcd35771278bcb4" alt="{{coverLabel}}" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
            <span style="font-size: 13px; color: #ABABAB">Это был</span>
            <span class="h" style="font-size: 20px; font-weight: 500; line-height: 1.25">{{ansTitle}}</span>
            <span style="font-size: 15px; color: #ABABAB">{{ansSub}}</span>
          </div>
          <div style="display: flex; gap: 10px; width: 100%">
            <div style="flex: 1; border: 1.5px solid #474747; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #ABABAB">Попытка</span><span class="h" style="font-size: 22px; font-weight: 800">{{attemptText}}</span></div>
            <div style="flex: 1; border: 1.5px solid {{scoreBd}}; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #ABABAB">Очки</span><span class="h" style="font-size: 22px; font-weight: 800; color: {{scoreFg}}">{{ptsText}}</span></div>
          </div>
          <div style="display: flex; gap: 10px; width: 100%">
            <button class="btn mid" type="button" onClick="{{toggleSave}}" aria-pressed="{{savedAria}}" style="flex: 0 0 auto; padding: 0 16px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l8-1.6V15"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="14.5" cy="15" r="2.5"/><path d="M19 3v6M16 6h6"/></svg><span style="font-size: 14px">{{saveText}}</span></button>
            <sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}"><button class="btn go mid" type="button" onClick="{{next}}" style="flex: 1">Продолжить</button></sc-if>
            <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}"><a class="btn go mid" href="Results.dc.html" style="flex: 1; color: #1A1A1A">К итогам</a></sc-if>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { round: 0, results: [], score: 0, playing: false, muted: false, q: '', selected: null, attempts: [], done: null, saved: false };
    this.timer = null;
  }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  catalog() {
    return [
      { title: 'Creep', artist: 'Radiohead', year: 1992, album: 'Pablo Honey' },
      { title: 'Karma Police', artist: 'Radiohead', year: 1997, album: 'OK Computer' },
      { title: 'No Surprises', artist: 'Radiohead', year: 1997, album: 'OK Computer' },
      { title: 'Radio Ga Ga', artist: 'Queen', year: 1984, album: 'The Works' },
      { title: 'Hysteria', artist: 'Muse', year: 2003, album: 'Absolution' },
      { title: 'Seven Nation Army', artist: 'The White Stripes', year: 2003, album: 'Elephant' },
      { title: 'Smells Like Teen Spirit', artist: 'Nirvana', year: 1991, album: 'Nevermind' },
      { title: 'Mr. Brightside', artist: 'The Killers', year: 2003, album: 'Hot Fuss' }
    ];
  }
  answer(round) {
    const order = ['Creep', 'Hysteria', 'Seven Nation Army', 'Smells Like Teen Spirit', 'Mr. Brightside'];
    const t = order[round];
    return this.catalog().filter((c) => c.title === t)[0];
  }
  finish(attempts, win) {
    const s = this.state;
    if (this.timer) clearTimeout(this.timer);
    const n = attempts.length;
    const exactPts = [100, 85, 70, 50, 30, 15];
    const hadPartial = attempts.some((a) => a.kind === 'partial');
    const allSkip = attempts.every((a) => a.kind === 'skip');
    let kind = 'miss';
    let pts = 0;
    if (win) { kind = 'exact'; pts = exactPts[n - 1]; }
    else if (hadPartial) { kind = 'partial'; pts = 25; }
    else if (allSkip) { kind = 'skip'; }
    this.setState({
      attempts, playing: false, q: '', selected: null, saved: false,
      done: { kind, n, pts }, results: s.results.concat([kind]), score: s.score + pts
    });
  }
  renderVals() {
    const secs = [1, 2, 4, 7, 11, 16];
    const s = this.state;
    const kindSt = {
      exact: { bg: '#27592F', bd: '#357A42', fg: '#9BE39F' },
      partial: { bg: '#5A4516', bd: '#7A5F1E', fg: '#F2B13B' },
      miss: { bg: '#552828', bd: '#7A3838', fg: '#F2A0A0' },
      skip: { bg: '#2E2E2E', bd: '#474747', fg: '#ABABAB' }
    };
    const kindName = { exact: 'угадал', partial: 'почти', miss: 'мимо', skip: 'пропуск' };
    const tabs = [];
    for (let i = 0; i < 5; i++) {
      const k = s.results[i];
      if (k) tabs.push({ label: String(i + 1), bg: kindSt[k].bg, bd: kindSt[k].bd, fg: kindSt[k].fg, aria: 'Раунд ' + (i + 1) + ': ' + kindName[k] });
      else if (i === s.round) tabs.push({ label: String(i + 1), bg: '#F2B13B', bd: '#F2B13B', fg: '#1A1A1A', aria: 'Раунд ' + (i + 1) + ': текущий' });
      else tabs.push({ label: String(i + 1), bg: '#242424', bd: '#474747', fg: '#6A6A6A', aria: 'Раунд ' + (i + 1) + ': впереди' });
    }
    const rows = [];
    for (let i = 0; i < 6; i++) {
      const a = s.attempts[i];
      if (a) {
        const st = kindSt[a.kind];
        rows.push({ text: a.text, bg: st.bg, bd: st.bd, fg: a.kind === 'skip' ? '#ABABAB' : '#F2F2F2', sh: 'none', jc: a.kind === 'skip' ? 'center' : 'space-between', check: a.kind === 'exact', cross: a.kind === 'miss', note: a.kind === 'partial' });
      } else if (i === s.attempts.length && !s.done) {
        rows.push({ text: '', bg: '#242424', bd: '#F2B13B', fg: '#ABABAB', sh: '0 0 0 4px rgba(242,177,59,.14)', jc: 'space-between', check: false, cross: false, note: false });
      } else {
        rows.push({ text: '', bg: 'transparent', bd: '#474747', fg: '#ABABAB', sh: 'none', jc: 'space-between', check: false, cross: false, note: false });
      }
    }
    const q = s.q.trim().toLowerCase();
    const matches = (!s.selected && q.length >= 2) ? this.catalog().filter((c) => (c.title + ' ' + c.artist).toLowerCase().includes(q)).slice(0, 5).map((c) => ({
      title: c.title, artist: c.artist, year: c.year, pick: () => this.setState({ selected: c, q: c.title + ' — ' + c.artist })
    })) : [];
    const lvl = s.done ? Math.min(5, Math.max(0, s.done.n - 1)) : Math.min(5, s.attempts.length);
    const pct = Math.round(secs[lvl] / 16 * 1000) / 10 + '%';
    const ans = this.answer(s.round);
    const d = s.done;
    const heads = {
      exact: { text: d ? 'Угадал с ' + d.n + '-й' : '', bg: '#F2B13B', fg: '#1A1A1A' },
      partial: { text: 'Почти: исполнитель верный', bg: '#5A4516', fg: '#F2F2F2' },
      miss: { text: 'Не в этот раз', bg: '#2E2E2E', fg: '#F2F2F2' },
      skip: { text: 'Пропущено', bg: '#2E2E2E', fg: '#F2F2F2' }
    };
    const hd = heads[d ? d.kind : 'miss'];
    const lastRound = s.round >= 4;
    const onLastTry = s.attempts.length === 5;
    return {
      score: s.score, maxScore: 500, tabs, rows, matches, q: s.q, hasQ: s.q.length > 0, showDd: matches.length > 0,
      hasSel: !!s.selected, showSkip: !s.selected && !onLastTry, showGive: !s.selected && onLastTry,
      inpBd: (s.selected || q.length >= 2) ? '#F2B13B' : '#474747',
      openSec: secs[lvl], markerPct: pct, playing: s.playing, idle: !s.playing,
      liveCls: s.playing ? 'live' : '', playDur: secs[lvl], playLabel: s.playing ? 'Пауза' : 'Слушать ' + secs[lvl] + ' с',
      sound: !s.muted, muted: s.muted, muteLabel: s.muted ? 'Включить звук' : 'Выключить звук',
      done: !!d,
      headText: hd.text, headBg: hd.bg, headFg: hd.fg,
      ansTitle: ans.title + ' — ' + ans.artist, ansSub: ans.artist + ' · ' + ans.year + ' · ' + ans.album, coverLabel: 'Обложка альбома ' + ans.album,
      attemptText: d ? (d.kind === 'exact' ? d.n + ' из 6' : (d.kind === 'skip' ? '—' : '6 из 6')) : '',
      ptsText: d ? (d.pts > 0 ? '+' + d.pts : '0') : '',
      scoreFg: d && d.pts > 0 ? '#F2B13B' : '#ABABAB',
      scoreBd: d && d.pts > 0 ? '#7A5F1E' : '#474747',
      saveText: s.saved ? 'В плейлисте' : 'В плейлист', savedAria: s.saved ? 'true' : 'false',
      hasNext: !lastRound, isLast: lastRound,
      toggleMute: () => this.setState({ muted: !s.muted }),
      toggleSave: () => this.setState({ saved: !s.saved }),
      onInput: (e) => this.setState({ q: e.target.value, selected: null }),
      clear: () => this.setState({ q: '', selected: null }),
      togglePlay: () => {
        if (this.timer) clearTimeout(this.timer);
        if (s.playing) { this.setState({ playing: false }); return; }
        this.setState({ playing: true });
        this.timer = setTimeout(() => this.setState({ playing: false }), secs[lvl] * 1000);
      },
      skip: () => { if (s.done) return; this.finishOrContinue(s.attempts.concat([{ text: 'Пропуск', kind: 'skip' }]), false); },
      giveUp: () => { if (s.done) return; this.finish(s.attempts.concat([{ text: 'Сдался', kind: 'skip' }]), false); },
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (s.done) return;
        if (!s.selected) { if (matches.length) matches[0].pick(); return; }
        const c = s.selected;
        const kind = (c.title === ans.title && c.artist === ans.artist) ? 'exact' : (c.artist === ans.artist ? 'partial' : 'miss');
        this.finishOrContinue(s.attempts.concat([{ text: c.title + ' — ' + c.artist, kind }]), kind === 'exact');
      },
      next: () => {
        if (this.timer) clearTimeout(this.timer);
        if (s.round >= 4) return;
        this.setState({ round: s.round + 1, playing: false, q: '', selected: null, attempts: [], done: null, saved: false });
      }
    };
  }
  finishOrContinue(attempts, win) {
    if (win || attempts.length >= 6) { this.finish(attempts, win); return; }
    if (this.timer) clearTimeout(this.timer);
    this.setState({ attempts, playing: false, q: '', selected: null });
  }
}
</script>
