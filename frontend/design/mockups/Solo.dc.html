<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Соло: режимы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141414}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:999px;border:1.5px solid transparent;background:transparent;color:#A3A3A3;display:grid;place-items:center;cursor:pointer}
.ib:hover{border-color:#3A3A3A;color:#F2F2F2}
.btn{font:inherit;font-weight:600;font-size:15px;height:48px;padding:0 20px;border-radius:14px;cursor:pointer;border:1.5px solid #3A3A3A;background:#1C1C1C;color:#F2F2F2;white-space:nowrap}
.btn:hover{border-color:#5A5A5A}
.btn.go{background:#F2B13B;border-color:#F2B13B;color:#141414}
.tab{height:36px;padding:0 16px;border-radius:999px;border:1.5px solid #3A3A3A;background:transparent;color:#A3A3A3;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tab.on{background:#F2F2F2;color:#141414;border-color:#F2F2F2}
.mode{width:100%;border:1.5px solid #3A3A3A;border-radius:14px;background:transparent;color:#F2F2F2;font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;padding:0 18px;height:60px;box-sizing:border-box}
.mode:hover{border-color:#5A5A5A;background:#1C1C1C}
.mode.on{border-color:#F2B13B;background:#1C1C1C;box-shadow:0 0 0 4px rgba(242,177,59,.14);border-bottom-left-radius:0;border-bottom-right-radius:0}
.panel{border:1.5px solid #F2B13B;border-top:0;border-radius:0 0 14px 14px;background:#1C1C1C;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;animation:rise .2s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid #3A3A3A;background:transparent;color:#A3A3A3;font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:#F2B13B;color:#F2F2F2}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 1; display: flex"><button class="ib" type="button" aria-label="Меню"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
    <a href="A-Game.dc.html" class="h" style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Guessverse</a>
    <div style="flex: 1; display: flex; gap: 4px; align-items: center; justify-content: flex-end">
      <button class="ib" type="button" aria-label="Как играть"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></svg></button>
      <button class="ib" type="button" aria-label="Прошлые дни"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <a href="Profile.dc.html" aria-label="Профиль" style="width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid #3A3A3A; display: grid; place-items: center; font-weight: 600; font-size: 13px; margin-left: 6px">ИЛ</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 6px 24px 48px; box-sizing: border-box">
    <div role="group" aria-label="Домен" style="display: inline-flex; padding: 3px; border-radius: 999px; background: #1C1C1C; border: 1.5px solid #3A3A3A; gap: 2px">
      <button type="button" class="btn" style="height: 38px; padding: 0 22px; border: 0; border-radius: 999px; background: #F2F2F2; color: #141414; font-size: 14px">Музыка</button>
      <button type="button" class="btn" style="height: 38px; padding: 0 22px; border: 0; border-radius: 999px; background: transparent; color: #A3A3A3; font-size: 14px">Кино</button>
    </div>

    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2px">
        <h1 class="h" style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Соло</h1>
        <span style="font-size: 14px; color: #A3A3A3">Без очереди и таймера</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="tab {{t.cls}}" type="button" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <div>
            <button class="mode {{m.cls}}" type="button" onClick="{{m.pick}}" aria-expanded="{{m.open}}">
              <span style="width: 40px; height: 40px; border-radius: 12px; background: #262626; display: grid; place-items: center; color: #F2B13B; flex: none"><span class="h" style="font-size: 13px; font-weight: 800">{{m.mark}}</span></span>
              <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{m.title}}</span><span style="font-size: 13px; color: #A3A3A3">{{m.sub}}</span></span>
              <span style="font-size: 13px; color: #A3A3A3; white-space: nowrap">{{m.best}}</span>
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: #A3A3A3; width: 18px; height: 18px; transform: rotate({{m.rot}})"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <sc-if value="{{m.open}}" hint-placeholder-val="{{false}}">
              <div class="panel">
                <span style="font-size: 15px; line-height: 1.5; color: #D9D9D9">{{m.desc}}</span>
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
                  <div style="display: flex; gap: 8px; align-items: center"><span style="font-size: 13px; color: #A3A3A3">Раундов</span><button class="chip" type="button">5</button><button class="chip on" type="button">10</button><button class="chip" type="button">20</button></div>
                  <a href="A-Game.dc.html" class="btn go" style="display: inline-flex; align-items: center; gap: 8px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M7 5v14l12-7z"/></svg>Играть</a>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'quick', open: 'classic' }; }
  renderVals() {
    const tabsDef = [['quick', 'Быстрые'], ['marathon', 'Марафоны'], ['pair', 'Пары'], ['collection', 'По сборнику']];
    const all = {
      quick: [
        { id: 'classic', mark: '1с', title: 'По отрывку', sub: '1, 2, 4, 7, 11, 16 секунд', best: 'рекорд 8 из 10', desc: 'Как в сегодняшней игре, но треков сколько захочешь. С каждой попыткой отрывок длиннее.' },
        { id: 'reverse', mark: '←', title: 'Задом наперёд', sub: 'отрывок в обратную сторону', best: 'рекорд 5 из 10', desc: 'Тот же отрывок, но перевёрнутый. Мелодия узнаваема, а мозг сопротивляется.' },
        { id: 'emoji', mark: '☺', title: 'Название картинками', sub: 'три пиктограммы вместо звука', best: 'ещё не играл', desc: 'Три знака описывают название. Подсказка за попытку открывает исполнителя.' },
        { id: 'random', mark: '?', title: 'Случайный режим', sub: 'сервер выбирает сам', best: '', desc: 'Один из режимов на выбор сервера. Хорош, когда не знаешь, чего хочется.' }
      ],
      marathon: [
        { id: 'artist', mark: '∞', title: 'Один исполнитель', sub: 'до первой ошибки', best: 'рекорд 23', desc: 'Выбери артиста и угадывай его треки, пока не ошибёшься.' },
        { id: 'director', mark: '∞', title: 'Один режиссёр', sub: 'до первой ошибки · кино', best: 'рекорд 9', desc: 'Все фильмы одного режиссёра по кадрам.' }
      ],
      pair: [
        { id: 'pop', mark: 'vs', title: 'Что популярнее', sub: 'два трека, один вопрос', best: 'серия 11', desc: 'Выбери тот, что слушают чаще. Серия правильных ответов растёт.' },
        { id: 'rating', mark: 'vs', title: 'Что выше в рейтинге', sub: 'два фильма · кино', best: 'серия 4', desc: 'Выбери фильм с оценкой выше.' }
      ],
      collection: [
        { id: 'own', mark: '▦', title: 'Свой сборник', sub: '3 сборника', best: '', desc: 'Сыграй подборку, которую собрал сам, или поделись ссылкой.' },
        { id: 'catalog', mark: '▦', title: 'Из каталога', sub: '1 240 подборок игроков', best: '', desc: 'Открыть каталог сборников с поиском и фильтрами.' }
      ]
    };
    const tabs = tabsDef.map(([id, label]) => ({ label, cls: id === this.state.tab ? 'on' : '', pick: () => this.setState({ tab: id, open: all[id][0].id }) }));
    const modes = all[this.state.tab].map((m) => {
      const open = m.id === this.state.open;
      return { ...m, open, cls: open ? 'on' : '', rot: open ? '180deg' : '0deg', pick: () => this.setState({ open: open ? null : m.id }) };
    });
    return { tabs, modes };
  }
}
</script>
</body>
</html>
