<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Магазин</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141414}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:999px;border:1.5px solid transparent;background:transparent;color:#A3A3A3;display:grid;place-items:center;cursor:pointer}
.btn{font:inherit;font-weight:600;font-size:15px;height:48px;padding:0 20px;border-radius:14px;cursor:pointer;border:1.5px solid #3A3A3A;background:#1C1C1C;color:#F2F2F2;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.go{background:#F2B13B;border-color:#F2B13B;color:#141414}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid #3A3A3A;background:transparent;color:#A3A3A3;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
.chip.on{border-color:#F2F2F2;color:#141414;background:#F2F2F2}
.item{aspect-ratio:1;border:1.5px solid #3A3A3A;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#F2F2F2;font:inherit;padding:0}
.item:hover{border-color:#5A5A5A;background:#1C1C1C}
.item.on{border-color:#F2B13B;background:#1C1C1C;box-shadow:0 0 0 4px rgba(242,177,59,.14)}
.item.lock{opacity:.5}
.ring{width:44px;height:44px;border-radius:999px;border:3px solid #A3A3A3}
.item span{font-size:12px;color:#A3A3A3}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 1; display: flex"><a href="Profile.dc.html" class="ib" style="width: auto; padding: 0 14px 0 8px; gap: 6px; display: inline-flex; align-items: center; font-size: 14px" aria-label="Назад в профиль"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M15 6l-6 6 6 6"/></svg>Профиль</a></div>
    <span class="h" style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Guessverse</span>
    <div style="flex: 1; display: flex; justify-content: flex-end"><span style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #3A3A3A; font-size: 15px; font-weight: 600; color: #F2B13B"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><circle cx="12" cy="12" r="8"/><path d="M9 9.5c0-1.4 1.3-2 3-2s3 .6 3 2-1.5 1.8-3 2.3-3 1-3 2.4 1.3 2.3 3 2.3 3-.8 3-2.3"/></svg>1 250</span></div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 6px 24px 48px; box-sizing: border-box">
    <section style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2px">
        <h1 class="h" style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Магазин</h1>
        <span style="font-size: 14px; color: #A3A3A3">Версы зарабатываются в игре, купить их нельзя</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button class="chip on" type="button">Рамки</button><button class="chip" type="button">Титулы</button><button class="chip" type="button">Темы</button><button class="chip" type="button">Звуки</button><button class="chip" type="button" style="margin-left: auto">Мои · 6</button>
      </div>
    </section>

    <section style="width: 100%; max-width: 760px; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 14px; align-items: stretch">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-content: start">
        <button class="item on" type="button" aria-label="Рамка Латунь, надета"><span class="ring" style="border-color: #F2B13B"></span><span>надета</span></button>
        <button class="item" type="button" aria-label="Рамка Иней, 120 Версов"><span class="ring" style="border-color: #DDE6F2; border-style: dashed"></span><span>120</span></button>
        <button class="item" type="button" aria-label="Рамка Плёнка, 200 Версов"><span class="ring" style="border-color: #A3A3A3; border-style: double; border-width: 5px"></span><span>200</span></button>
        <button class="item" type="button" aria-label="Рамка Винил, 200 Версов"><span class="ring" style="border-color: #2A2A2A; box-shadow: 0 0 0 3px #5A5A5A"></span><span>200</span></button>
        <button class="item" type="button" aria-label="Рамка Эфир, 350 Версов"><span class="ring" style="border-color: #F2F2F2"></span><span>350</span></button>
        <button class="item lock" type="button" aria-label="Рамка Неон, откроется на 15 уровне"><span class="ring" style="border-color: #F2B13B; box-shadow: 0 0 12px rgba(242,177,59,.6)"></span><span>уровень 15</span></button>
        <button class="item lock" type="button" aria-label="Рамка Золото, награда сезона"><span class="ring" style="border-color: #F2B13B; border-width: 5px"></span><span>сезон</span></button>
        <button class="item" type="button" aria-label="Рамка Событие, 9 находок"><span class="ring" style="border-color: #9BE39F"></span><span>событие</span></button>
        <button class="item" type="button" aria-label="Рамка Кадр, 260 Версов"><span class="ring" style="border-color: #A3A3A3; border-radius: 10px"></span><span>260</span></button>
        <button class="item" type="button" aria-label="Рамка Тонарм, 300 Версов"><span class="ring" style="border-color: #A3A3A3; border-top-color: #F2B13B"></span><span>300</span></button>
      </div>
      <aside style="border: 1.5px solid #3A3A3A; border-radius: 14px; background: #1C1C1C; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <span style="width: 84px; height: 84px; border-radius: 999px; border: 3px solid #F2B13B; display: grid; place-items: center; font-weight: 600; font-size: 22px">ИЛ</span>
        <span class="h" style="font-size: 16px; font-weight: 500">Латунь</span>
        <span style="font-size: 13px; color: #A3A3A3; line-height: 1.5">Рамка аватарки. Видна в дуэлях, лобби и таблицах.</span>
        <button class="btn" type="button" style="width: 100%; height: 44px; margin-top: auto">Снять</button>
      </aside>
    </section>

    <section style="width: 100%; max-width: 760px; border: 1.5px solid #3A3A3A; border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-sizing: border-box">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Промокод</span><span style="font-size: 13px; color: #A3A3A3">Из розыгрышей и от друзей</span></span>
      <div style="display: flex; gap: 8px"><input type="text" placeholder="КОД" aria-label="Промокод" style="width: 140px; height: 44px; border-radius: 12px; border: 1.5px solid #3A3A3A; background: #141414; color: #F2F2F2; padding: 0 14px; font: inherit; font-size: 15px; letter-spacing: .1em; box-sizing: border-box"><button class="btn" type="button" style="height: 44px">Применить</button></div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
