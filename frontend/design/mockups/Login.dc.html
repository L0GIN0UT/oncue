<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141414}
a{color:#F2B13B;text-decoration:none}a:hover{color:#FFC75F}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.inp{width:100%;height:56px;border-radius:14px;border:1.5px solid #3A3A3A;background:#1C1C1C;color:#F2F2F2;padding:0 16px;font:inherit;font-size:16px;box-sizing:border-box;outline:none}
.inp:focus{border-color:#F2B13B;box-shadow:0 0 0 4px rgba(242,177,59,.14)}
.btn{font:inherit;font-weight:600;font-size:16px;height:56px;padding:0 24px;border-radius:14px;cursor:pointer;border:1.5px solid #3A3A3A;background:#1C1C1C;color:#F2F2F2;display:inline-flex;align-items:center;gap:10px;justify-content:center;width:100%;box-sizing:border-box}
.btn.go{background:#F2B13B;border-color:#F2B13B;color:#141414}
.lbl{font-size:14px;color:#A3A3A3}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: center; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <a href="A-Game.dc.html" class="h" style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: #F2F2F2">Guessverse</a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 6px 24px 80px; box-sizing: border-box">
    <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; text-align: center">
      <h1 class="h" style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">С возвращением</h1>
      <span style="font-size: 15px; color: #A3A3A3">Сегодняшнюю игру можно сыграть и без входа. Со входом считаются серия, рейтинг и Версы.</span>
    </div>

    <form style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="login" class="lbl">Почта или ник</label>
        <input id="login" class="inp" type="text" autocomplete="username">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between"><label for="pass" class="lbl">Пароль</label><a href="Login.dc.html" style="font-size: 14px">Забыл пароль</a></div>
        <div style="position: relative; display: flex; align-items: center">
          <input id="pass" class="inp" type="password" autocomplete="current-password" style="padding-right: 52px">
          <button type="button" aria-label="Показать пароль" style="position: absolute; right: 8px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #A3A3A3; cursor: pointer; display: grid; place-items: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn go" type="submit" style="margin-top: 6px">Войти</button>
      <div style="display: flex; align-items: center; gap: 12px; color: #5A5A5A; font-size: 13px"><span style="flex: 1; height: 1.5px; background: #3A3A3A"></span>или<span style="flex: 1; height: 1.5px; background: #3A3A3A"></span></div>
      <a href="Login.dc.html" class="btn">Создать аккаунт</a>
      <a href="A-Game.dc.html" style="text-align: center; font-size: 14px; color: #A3A3A3; margin-top: 4px">Играть без входа</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>

  renderVals() { return {}; }

</body>
</html>
