<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ответ раунда</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141414}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;box-sizing:border-box;border:1.5px solid #3A3A3A}
.btn{font:inherit;font-weight:600;font-size:16px;height:52px;padding:0 24px;border-radius:14px;cursor:pointer;border:1.5px solid #3A3A3A;background:#1C1C1C;color:#F2F2F2;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.go{background:#F2B13B;border-color:#F2B13B;color:#141414}
.ib{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:#A3A3A3;display:grid;place-items:center;cursor:pointer}
@keyframes modal{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
.modal{animation:modal .25s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.modal{animation:none}}
.art{position:relative;overflow:hidden;background:#262626;display:grid;place-items:center;color:#5A5A5A}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box; opacity: .5">
    <div style="flex: 1; display: flex"><span class="ib"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span></div>
    <span class="h" style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Guessverse</span>
    <div style="flex: 1; display: flex; justify-content: flex-end"><span style="width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid #3A3A3A; display: grid; place-items: center; font-weight: 600; font-size: 13px">ИЛ</span></div>
  </header>

  <main aria-hidden="true" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 16px 24px 48px; box-sizing: border-box; opacity: .35; filter: blur(1px)">
    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 10px; padding: 0 2px 4px"><span class="h" style="font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">3</span><span class="h" style="font-size: 15px; font-weight: 500; color: #A3A3A3">раунд из 10</span></div>
      <div class="row" style="background: #4D2323; border-color: #6B3030"><span>Muse — Hysteria</span></div>
      <div class="row" style="background: #4D3B12; border-color: #6B5319"><span>Radiohead — Karma Police</span></div>
      <div class="row" style="background: #214D2A; border-color: #2E6B3A"><span>Radiohead — Creep</span></div>
      <div class="row"></div><div class="row"></div><div class="row"></div>
    </section>
    <div style="width: 100%; max-width: 640px; height: 16px; border-radius: 8px; background: #2A2A2A; border: 1.5px solid #3A3A3A"></div>
    <span style="width: 88px; height: 88px; border-radius: 999px; background: #F2B13B"></span>
  </main>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <div class="modal" role="dialog" aria-label="Ответ раунда" style="width: 100%; max-width: 440px; background: #1C1C1C; border: 1.5px solid #3A3A3A; border-radius: 20px; overflow: hidden; position: relative">
      <div class="h" style="padding: 14px 16px; background: {{headBg}}; color: {{headFg}}; font-size: 17px; font-weight: 800; text-align: center">{{headText}}</div>
      <button class="ib" type="button" aria-label="Закрыть" style="position: absolute; top: 4px; right: 4px; color: {{headFg}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

      <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: center">
        <sc-if value="{{isMusic}}" hint-placeholder-val="{{true}}">
          <div class="art" style="width: 220px; height: 220px; border-radius: 14px; background: radial-gradient(circle at 50% 50%, #3A3A3A 0 18%, #262626 19% 22%, #1C1C1C 23% 26%, #262626 27% 60%, #1C1C1C 61%)" role="img" aria-label="Обложка альбома Pablo Honey">
            <span style="position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #5A5A5A">обложка 600×600</span>
          </div>
        </sc-if>
        <sc-if value="{{isFilm}}" hint-placeholder-val="{{false}}">
          <div class="art" style="width: 180px; height: 270px; border-radius: 14px; background: linear-gradient(180deg, #2E2E3A 0%, #262626 60%, #1C1C1C 100%)" role="img" aria-label="Постер фильма Интерстеллар">
            <span style="position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #5A5A5A">постер 600×900</span>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
          <span style="font-size: 13px; color: #A3A3A3">Это был</span>
          <span class="h" style="font-size: 20px; font-weight: 500; line-height: 1.25">{{title}}</span>
          <span style="font-size: 15px; color: #A3A3A3">{{subtitle}}</span>
        </div>

        <div style="display: flex; gap: 10px; width: 100%">
          <div style="flex: 1; border: 1.5px solid #3A3A3A; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #A3A3A3">Попытка</span><span class="h" style="font-size: 22px; font-weight: 800">{{attempt}}</span></div>
          <div style="flex: 1; border: 1.5px solid {{scoreBd}}; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #A3A3A3">Очки</span><span class="h" style="font-size: 22px; font-weight: 800; color: {{scoreFg}}">{{score}}</span></div>
        </div>

        <div style="display: flex; gap: 10px; width: 100%">
          <sc-if value="{{isFilm}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" style="flex: 0 0 auto; padding: 0 16px; gap: 8px" aria-label="Добавить фильм в закладки"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/><path d="M12 8v6M9 11h6"/></svg><span style="font-size: 14px">В закладки</span></button></sc-if>
          <sc-if value="{{isMusic}}" hint-placeholder-val="{{true}}"><button class="btn" type="button" style="flex: 0 0 auto; padding: 0 16px; gap: 8px" aria-label="Добавить трек в плейлист"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l8-1.6V15"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="14.5" cy="15" r="2.5"/><path d="M19 3v6M16 6h6"/></svg><span style="font-size: 14px">В плейлист</span></button></sc-if>
          <button class="btn go" type="button" style="flex: 1">{{nextText}}</button>
        </div>
        <span style="font-size: 12px; color: #5A5A5A">Пробел или Enter: продолжить</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"domain":{"editor":"enum","options":["music","film"],"default":"music","section":"Состояние"},"outcome":{"editor":"enum","options":["exact","partial","miss","skip"],"default":"exact","section":"Состояние"},"last":{"editor":"boolean","default":false,"section":"Состояние"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const domain = this.props.domain ?? 'music';
    const outcome = this.props.outcome ?? 'exact';
    const last = this.props.last ?? false;
    const heads = {
      exact: { text: 'Угадал с 3-й', bg: '#F2B13B', fg: '#141414' },
      partial: { text: 'Почти: исполнитель верный', bg: '#4D3B12', fg: '#F2F2F2' },
      miss: { text: 'Не в этот раз', bg: '#3A3A3A', fg: '#F2F2F2' },
      skip: { text: 'Пропущено', bg: '#3A3A3A', fg: '#F2F2F2' }
    };
    const h = heads[outcome];
    const score = outcome === 'exact' ? '+70' : (outcome === 'partial' ? '+25' : '0');
    return {
      isMusic: domain === 'music', isFilm: domain === 'film',
      headText: h.text, headBg: h.bg, headFg: h.fg,
      title: domain === 'music' ? 'Creep' : 'Интерстеллар',
      subtitle: domain === 'music' ? 'Radiohead · 1992 · Pablo Honey' : 'Кристофер Нолан · 2014',
      attempt: outcome === 'exact' ? '3 из 6' : (outcome === 'partial' ? '4 из 6' : '6 из 6'),
      openSec: outcome === 'exact' ? 4 : 16,
      score, scoreFg: outcome === 'exact' ? '#F2B13B' : (outcome === 'partial' ? '#F2B13B' : '#A3A3A3'),
      scoreBd: outcome === 'miss' || outcome === 'skip' ? '#3A3A3A' : '#6B5319',
      nextText: last ? 'К итогам' : 'Продолжить'
    };
  }
}
</script>
</body>
</html>
