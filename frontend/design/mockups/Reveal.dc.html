<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ответ раунда</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1A1A}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A6A;font-weight:600}
.row{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;box-sizing:border-box;border:1.5px solid #474747}
.rtab{flex:1;height:34px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:600;box-sizing:border-box;border:1.5px solid #474747}
.btn{font:inherit;font-weight:600;font-size:15px;height:50px;padding:0 18px;border-radius:14px;cursor:pointer;border:1.5px solid #474747;background:#2E2E2E;color:#F2F2F2;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:#6A6A6A}
.btn.go{background:#F2B13B;border-color:#F2B13B;color:#1A1A1A}
.ib{width:40px;height:40px;border-radius:999px;border:1.5px solid #474747;background:#242424;color:#ABABAB;display:grid;place-items:center;padding:0}
.pillbtn{height:40px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid #474747;background:#242424;color:#F2F2F2;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.cls{width:40px;height:40px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
@keyframes modal{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
.modal{animation:modal .25s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.modal{animation:none}}
.art{position:relative;overflow:hidden;background:#2E2E2E;display:grid;place-items:center;color:#6A6A6A}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box; position: relative">

  <header aria-hidden="true" style="display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box; opacity: .5">
    <div style="flex: 1; display: flex; align-items: center; gap: 8px">
      <span class="pillbtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Выйти</span>
      <span class="ib"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span class="h" style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">Guessverse</span>
      <span class="cap">Дейлик · музыка · 26 октября</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <span style="display: inline-flex; align-items: baseline; gap: 6px"><span class="h" style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">{{score}}</span><span class="h" style="font-size: 15px; font-weight: 500; color: #6A6A6A">/ 500</span></span>
      <span class="cap">очки</span>
    </div>
  </header>

  <main aria-hidden="true" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 10px 24px 48px; box-sizing: border-box; opacity: .35; filter: blur(1px)">
    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 8px; margin-bottom: 6px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <span class="rtab" style="background: {{t.bg}}; border-color: {{t.bd}}; color: {{t.fg}}">{{t.label}}</span>
        </sc-for>
      </div>
      <div class="row" style="background: #552828; border-color: #7A3838"><span>Muse — Hysteria</span></div>
      <div class="row" style="background: #5A4516; border-color: #7A5F1E"><span>Radiohead — Karma Police</span></div>
      <div class="row" style="background: #27592F; border-color: #357A42"><span>Radiohead — Creep</span></div>
      <div class="row"></div><div class="row"></div><div class="row"></div>
    </section>
    <div style="width: 100%; max-width: 640px; height: 16px; border-radius: 8px; background: #333333; border: 1.5px solid #474747; box-sizing: border-box"></div>
    <span style="width: 88px; height: 88px; border-radius: 999px; background: #F2B13B"></span>
  </main>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <div class="modal" role="dialog" aria-label="Ответ раунда" style="width: 100%; max-width: 440px; background: #242424; border: 1.5px solid #474747; border-radius: 20px; overflow: hidden; position: relative">
      <div class="h" style="padding: 14px 16px; background: {{headBg}}; color: {{headFg}}; font-size: 17px; font-weight: 800; text-align: center">{{headText}}</div>
      <button class="cls" type="button" aria-label="Закрыть" style="position: absolute; top: 4px; right: 4px; color: {{headFg}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

      <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: center">
        <sc-if value="{{isMusic}}" hint-placeholder-val="{{true}}">
          <div class="art" style="width: 220px; height: 220px; border-radius: 14px; overflow: hidden; background: #2E2E2E"><img src="/_blob/a2fe74f4ed1c52b41bcd35771278bcb4" alt="Обложка альбома Pablo Honey" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
        </sc-if>
        <sc-if value="{{isFilm}}" hint-placeholder-val="{{false}}">
          <div class="art" style="width: 180px; height: 270px; border-radius: 14px; overflow: hidden; background: #2E2E2E"><img src="/_blob/ec695be17639de90d600f2cc385c1d47" alt="Постер фильма Интерстеллар" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
        </sc-if>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
          <span style="font-size: 13px; color: #ABABAB">Это был</span>
          <span class="h" style="font-size: 20px; font-weight: 500; line-height: 1.25">{{title}}</span>
          <span style="font-size: 15px; color: #ABABAB">{{subtitle}}</span>
        </div>

        <div style="display: flex; gap: 10px; width: 100%">
          <div style="flex: 1; border: 1.5px solid #474747; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #ABABAB">Попытка</span><span class="h" style="font-size: 22px; font-weight: 800">{{attempt}}</span></div>
          <div style="flex: 1; border: 1.5px solid {{scoreBd}}; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #ABABAB">Очки</span><span class="h" style="font-size: 22px; font-weight: 800; color: {{scoreFg}}">{{points}}</span></div>
        </div>

        <div style="display: flex; gap: 10px; width: 100%">
          <sc-if value="{{isFilm}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" style="flex: 0 0 auto; padding: 0 16px" aria-label="Добавить фильм в закладки"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/><path d="M12 8v6M9 11h6"/></svg><span style="font-size: 14px">В закладки</span></button></sc-if>
          <sc-if value="{{isMusic}}" hint-placeholder-val="{{true}}"><button class="btn" type="button" style="flex: 0 0 auto; padding: 0 16px" aria-label="Добавить трек в плейлист"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l8-1.6V15"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="14.5" cy="15" r="2.5"/><path d="M19 3v6M16 6h6"/></svg><span style="font-size: 14px">В плейлист</span></button></sc-if>
          <button class="btn go" type="button" style="flex: 1">{{nextText}}</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"domain":{"editor":"enum","options":["music","film"],"default":"music","section":"Состояние"},"outcome":{"editor":"enum","options":["exact","partial","miss","skip"],"default":"exact","section":"Состояние"},"last":{"editor":"boolean","default":false,"section":"Состояние"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const domain = this.props.domain ?? 'music';
    const outcome = this.props.outcome ?? 'exact';
    const last = this.props.last ?? false;
    const heads = {
      exact: { text: 'Угадал с 3-й', bg: '#F2B13B', fg: '#1A1A1A' },
      partial: { text: 'Почти: исполнитель верный', bg: '#5A4516', fg: '#F2F2F2' },
      miss: { text: 'Не в этот раз', bg: '#2E2E2E', fg: '#F2F2F2' },
      skip: { text: 'Пропущено', bg: '#2E2E2E', fg: '#F2F2F2' }
    };
    const st = {
      exact: { bg: '#27592F', bd: '#357A42', fg: '#9BE39F' },
      partial: { bg: '#5A4516', bd: '#7A5F1E', fg: '#F2B13B' },
      miss: { bg: '#552828', bd: '#7A3838', fg: '#F2A0A0' },
      skip: { bg: '#2E2E2E', bd: '#474747', fg: '#ABABAB' }
    };
    const h = heads[outcome];
    const cur = last ? 4 : 2;
    const prev = ['exact', 'partial', 'miss', 'exact'];
    const tabs = [];
    for (let i = 0; i < 5; i++) {
      if (i < cur) tabs.push({ label: String(i + 1), bg: st[prev[i]].bg, bd: st[prev[i]].bd, fg: st[prev[i]].fg });
      else if (i === cur) tabs.push({ label: String(i + 1), bg: '#F2B13B', bd: '#F2B13B', fg: '#1A1A1A' });
      else tabs.push({ label: String(i + 1), bg: '#242424', bd: '#474747', fg: '#6A6A6A' });
    }
    const points = outcome === 'exact' ? '+70' : (outcome === 'partial' ? '+25' : '0');
    return {
      isMusic: domain === 'music', isFilm: domain === 'film',
      headText: h.text, headBg: h.bg, headFg: h.fg,
      title: domain === 'music' ? 'Creep' : 'Интерстеллар',
      subtitle: domain === 'music' ? 'Radiohead · 1992 · Pablo Honey' : 'Кристофер Нолан · 2014',
      attempt: outcome === 'exact' ? '3 из 6' : (outcome === 'partial' ? '4 из 6' : '6 из 6'),
      points, scoreFg: outcome === 'exact' || outcome === 'partial' ? '#F2B13B' : '#ABABAB',
      scoreBd: outcome === 'miss' || outcome === 'skip' ? '#474747' : '#7A5F1E',
      nextText: last ? 'К итогам' : 'Продолжить',
      tabs, score: last ? '305' : '110'
    };
  }
}
</script>
</body>
</html>
