<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>C · Игровое шоу — игра</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#4B2BD9}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFD449}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:#FFFFFF;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:#3A1FB8}
.slot{height:54px;border-radius:999px;background:#3A1FB8;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:16px;font-weight:500;box-sizing:border-box;box-shadow:0 4px 0 #2A1390}
.play{width:96px;height:96px;border-radius:999px;border:0;background:#FFD449;color:#2A1390;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 0 #B8931A;transition:transform .1s,box-shadow .1s}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #B8931A}
.btn{font:inherit;font-weight:700;font-size:16px;height:56px;padding:0 24px;border-radius:999px;border:0;cursor:pointer}
</style>
</helmet>
<div style="font-family: 'Rubik', system-ui, sans-serif; color: #FFFFFF; min-height: 860px; display: flex; flex-direction: column; box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <button class="ib" type="button" aria-label="Меню"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a href="C-Game.dc.html" style="font-size: 28px; font-weight: 900; letter-spacing: -0.03em">Guessverse</a>
    <div style="display: flex; gap: 4px; align-items: center">
      <button class="ib" type="button" aria-label="Как играть"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></svg></button>
      <button class="ib" type="button" aria-label="Прошлые дни"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <a href="C-Game.dc.html" aria-label="Профиль" style="width: 38px; height: 38px; border-radius: 999px; background: #FFD449; color: #2A1390; display: grid; place-items: center; font-weight: 900; font-size: 13px; margin-left: 8px; box-shadow: 0 3px 0 #B8931A">ИЛ</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 8px 24px 48px; box-sizing: border-box">
    <div role="group" aria-label="Домен" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #3A1FB8; gap: 2px; box-shadow: 0 4px 0 #2A1390">
      <button type="button" class="btn" style="height: 40px; padding: 0 22px; background: #FFD449; color: #2A1390; font-size: 14px">Музыка</button>
      <button type="button" class="btn" style="height: 40px; padding: 0 22px; background: transparent; color: #C9BFFF; font-size: 14px">Кино</button>
    </div>

    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.03em; line-height: 1">Раунд 3 из 10</h1>
        <span style="font-size: 14px; color: #C9BFFF">Сегодняшняя игра · серия 12</span>
      </div>
      <div class="slot"><span style="color: #C9BFFF">Muse — Hysteria</span><svg class="ico" viewBox="0 0 24 24" role="img" aria-label="Мимо" style="color:#8F7FE6"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="slot" style="box-shadow: inset 0 0 0 3px #FFD449, 0 4px 0 #2A1390"><span>Radiohead — Karma Police</span><span style="font-size: 13px; color: #FFD449; font-weight: 700">исполнитель верный</span></div>
      <div class="slot" style="background: transparent; box-shadow: inset 0 0 0 3px #3A1FB8"></div>
      <div class="slot" style="background: transparent; box-shadow: inset 0 0 0 3px #3A1FB8"></div>
      <div class="slot" style="background: transparent; box-shadow: inset 0 0 0 3px #3A1FB8"></div>
      <div class="slot" style="background: transparent; box-shadow: inset 0 0 0 3px #3A1FB8"></div>
    </section>

    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; color: #C9BFFF; padding: 0 6px">Открыто 4 секунды</span>
      <div style="display: flex; gap: 4px; height: 18px"><span style="flex:1;background:#FFD449;border-radius:999px"></span><span style="flex:1;background:#FFD449;border-radius:999px"></span><span style="flex:2;background:#FFD449;border-radius:999px"></span><span style="flex:3;background:#3A1FB8;border-radius:999px"></span><span style="flex:4;background:#3A1FB8;border-radius:999px"></span><span style="flex:5;background:#3A1FB8;border-radius:999px"></span></div>
      <div style="display: flex; gap: 4px; font-size: 12px; color: #C9BFFF; padding: 0 6px"><span style="flex:1">1</span><span style="flex:1">2</span><span style="flex:2">4</span><span style="flex:3">7</span><span style="flex:4">11</span><span style="flex:5; text-align: right">16 с</span></div>
    </section>

    <button class="play" type="button" aria-label="Слушать 4 секунды"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:40px;height:40px;margin-left:5px"><path d="M7 5v14l12-7z"/></svg></button>

    <form style="width: 100%; max-width: 640px; display: flex; gap: 10px" onSubmit="{{noop}}">
      <label for="guess" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Твой ответ</label>
      <div style="flex: 1; position: relative; display: flex; align-items: center">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 20px; color: #8F7FE6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="guess" type="text" placeholder="Исполнитель или название" autocomplete="off" style="width: 100%; height: 56px; border-radius: 999px; border: 0; background: #FFFFFF; color: #2A1390; padding: 0 20px 0 52px; font: inherit; font-size: 16px; font-weight: 500; box-sizing: border-box; box-shadow: 0 4px 0 #2A1390">
      </div>
      <button class="btn" type="button" style="background: #3A1FB8; color: #FFFFFF; box-shadow: 0 4px 0 #2A1390">Пропустить</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return { noop: (e) => { if (e && e.preventDefault) e.preventDefault(); } }; }
}
</script>
</body>
</html>
