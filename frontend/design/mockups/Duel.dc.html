<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рейтинговая дуэль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1A1A}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6A6A6A;font-weight:600}
.ib{width:40px;height:40px;border-radius:999px;border:1.5px solid #474747;background:#242424;color:#ABABAB;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{color:#F2F2F2;border-color:#6A6A6A}
.pillbtn{height:40px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid #474747;background:#242424;color:#F2F2F2;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.pillbtn:hover{border-color:#6A6A6A}
.row{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;box-sizing:border-box;border:1.5px solid #474747}
.play{width:88px;height:88px;border-radius:999px;border:0;background:#F2B13B;color:#1A1A1A;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 6px rgba(242,177,59,.14);padding:0}
.btn{font:inherit;font-weight:600;font-size:16px;height:56px;padding:0 24px;border-radius:14px;cursor:pointer;border:1.5px solid #474747;background:#242424;color:#F2F2F2;white-space:nowrap}
.btn:hover{border-color:#6A6A6A}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#1A1A1A}
.dot{width:14px;height:14px;border-radius:999px;box-sizing:border-box;border:1.5px solid #474747;background:#2E2E2E;display:inline-block}
.ava{width:40px;height:40px;border-radius:999px;border:1.5px solid #474747;background:#2E2E2E;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.live{animation:blink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.live{animation:none}}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box">

  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 1; display: flex; align-items: center; gap: 8px">
      <button class="pillbtn" type="button" style="color: #F2A0A0"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Сдаться</button>
      <button class="ib" type="button" aria-label="Выключить звук"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span class="h" style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">Guessverse</span>
      <span class="cap">Дуэль · рейтинговая · классика</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <span class="h" style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">1 482</span>
      <span class="cap">твой рейтинг</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 10px 24px 48px; box-sizing: border-box">
    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <div aria-label="Счёт дуэли" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #242424; border: 1.5px solid #474747; border-radius: 20px; padding: 14px 18px; margin-bottom: 6px; box-sizing: border-box">
        <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0">
          <span class="ava" style="border-color: #F2B13B">ИЛ</span>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">Ты</span>
            <span role="img" aria-label="Твои раунды: два выиграны, один проигран" style="display: inline-flex; gap: 6px">
              <span class="dot" style="background: #27592F; border-color: #357A42"></span>
              <span class="dot" style="background: #552828; border-color: #7A3838"></span>
              <span class="dot" style="background: #27592F; border-color: #357A42"></span>
              <span class="dot" style="border-color: #F2B13B"></span>
              <span class="dot"></span>
            </span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span class="h" style="font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">2 : 1</span>
          <span class="cap">раунд 4 из 5</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex: 1; min-width: 0">
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">Алина · <span style="color: #ABABAB; font-weight: 500">1 530</span></span>
            <span role="img" aria-label="Раунды Алины: один выигран, два проиграны" style="display: inline-flex; gap: 6px">
              <span class="dot" style="background: #552828; border-color: #7A3838"></span>
              <span class="dot" style="background: #27592F; border-color: #357A42"></span>
              <span class="dot" style="background: #552828; border-color: #7A3838"></span>
              <span class="dot" style="border-color: #F2B13B"></span>
              <span class="dot"></span>
            </span>
          </div>
          <span class="ava">АЛ</span>
        </div>
      </div>
      <div class="row" style="background: #552828; border-color: #7A3838"><span>Muse — Hysteria</span><svg class="ico" viewBox="0 0 24 24" role="img" aria-label="Мимо" style="color:#F2A0A0"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="row" style="border-color: #F2B13B; background: #242424; box-shadow: 0 0 0 4px rgba(242,177,59,.14)"></div>
      <div class="row"></div>
      <div class="row"></div>
      <div class="row"></div>
      <div class="row"></div>
    </section>

    <section style="width: 100%; max-width: 640px; position: relative; padding-top: 30px">
      <span class="h" style="position: absolute; top: 0; left: 12.5%; transform: translateX(-50%); font-size: 14px; font-weight: 500; color: #F2B13B; white-space: nowrap">2 с</span>
      <span style="position: absolute; top: 20px; left: 12.5%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #F2B13B"></span>
      <div style="position: relative; height: 16px; border-radius: 8px; background: #333333; border: 1.5px solid #474747; overflow: hidden">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 12.5%; background: #F2B13B"></span>
        <span class="tick" style="left: 6.25%"></span><span class="tick" style="left: 12.5%"></span><span class="tick" style="left: 25%"></span><span class="tick" style="left: 43.75%"></span><span class="tick" style="left: 68.75%"></span>
      </div>
      <span style="position: absolute; top: 2px; left: 25%; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: #ABABAB; white-space: nowrap">Алина · 4 с</span>
      <span style="position: absolute; top: 20px; left: 25%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #6A6A6A"></span>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 8px; font-size: 13px; color: #ABABAB">
        <span class="live" style="width: 8px; height: 8px; border-radius: 999px; background: #F2B13B; display: inline-block"></span>Алина слушает 4 с
      </div>
    </section>

    <button class="play" type="button" aria-label="Слушать 2 секунды"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px;margin-left:4px"><path d="M7 5v14l12-7z"/></svg></button>

    <form style="width: 100%; max-width: 640px; display: flex; gap: 10px">
      <label for="guess" style="position: absolute; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Твой ответ</label>
      <div style="flex: 1; position: relative; display: flex; align-items: center">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 16px; color: #ABABAB"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="guess" type="text" placeholder="Название трека или исполнитель" autocomplete="off" style="width: 100%; height: 56px; border-radius: 14px; border: 1.5px solid #474747; background: #242424; color: #F2F2F2; padding: 0 16px 0 48px; font: inherit; font-size: 16px; box-sizing: border-box; outline: none">
      </div>
      <button class="btn" type="button">Пропустить</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
