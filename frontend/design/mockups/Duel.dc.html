<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дуэль: раунд</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141414}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:999px;border:1.5px solid transparent;background:transparent;color:#A3A3A3;display:grid;place-items:center;cursor:pointer}
.ib:hover{border-color:#3A3A3A;color:#F2F2F2}
.row{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;box-sizing:border-box;border:1.5px solid #3A3A3A}
.btn{font:inherit;font-weight:600;font-size:16px;height:56px;padding:0 24px;border-radius:14px;cursor:pointer;border:1.5px solid #3A3A3A;background:#1C1C1C;color:#F2F2F2;white-space:nowrap}
.play{width:88px;height:88px;border-radius:999px;border:0;background:#F2B13B;color:#141414;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 6px rgba(242,177,59,.12)}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#141414}
.pl{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.av{width:40px;height:40px;border-radius:999px;border:1.5px solid #3A3A3A;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.dots{display:flex;gap:4px}.dots i{width:14px;height:6px;border-radius:3px;background:#3A3A3A;display:block}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 1; display: flex"><a href="Online.dc.html" class="ib" style="width: auto; padding: 0 14px 0 8px; gap: 6px; display: inline-flex; align-items: center; font-size: 14px" aria-label="Сдаться и выйти"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M15 6l-6 6 6 6"/></svg>Сдаться</a></div>
    <span class="h" style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Guessverse</span>
    <div style="flex: 1; display: flex; justify-content: flex-end"><span style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #3A3A3A; font-size: 14px; color: #A3A3A3"><span style="width: 8px; height: 8px; border-radius: 999px; background: #F2A0A0"></span>Рейтинговая</span></div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 6px 24px 48px; box-sizing: border-box">
    <section style="width: 100%; max-width: 640px; border: 1.5px solid #3A3A3A; border-radius: 14px; background: #1C1C1C; padding: 14px 18px; display: flex; align-items: center; gap: 18px">
      <div class="pl">
        <span class="av" style="border-color: #F2B13B">ИЛ</span>
        <span style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-weight: 600">Ты</span><span class="dots" aria-label="Твои раунды: 2 победы, 1 поражение"><i style="background:#9BE39F"></i><i style="background:#9BE39F"></i><i style="background:#F2A0A0"></i><i></i><i></i></span></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span class="h" style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">2 : 1</span>
        <span style="font-size: 12px; color: #A3A3A3">раунд 4 из 5</span>
      </div>
      <div class="pl" style="justify-content: flex-end">
        <span style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 0"><span style="font-weight: 600">Алина <span style="font-weight: 400; color: #A3A3A3; font-size: 13px">· 1 530</span></span><span class="dots" aria-label="Раунды соперника: 1 победа, 2 поражения"><i style="background:#F2A0A0"></i><i style="background:#F2A0A0"></i><i style="background:#9BE39F"></i><i></i><i></i></span></span>
        <span class="av">АК</span>
      </div>
    </section>

    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px 4px">
        <span style="font-size: 14px; color: #A3A3A3">Кто угадает за меньше секунд, берёт раунд</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #F2B13B"><span style="width: 8px; height: 8px; border-radius: 999px; background: #F2B13B"></span>Алина слушает 4 с</span>
      </div>
      <div class="row" style="background: #4D2323; border-color: #6B3030"><span>Muse — Hysteria</span><svg class="ico" viewBox="0 0 24 24" role="img" aria-label="Мимо" style="color:#F2A0A0"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="row" style="border-color: #F2B13B; box-shadow: 0 0 0 4px rgba(242,177,59,.14)"></div>
      <div class="row"></div>
      <div class="row"></div>
      <div class="row"></div>
      <div class="row"></div>
    </section>

    <section style="width: 100%; max-width: 640px; position: relative; padding-top: 30px">
      <span class="h" style="position: absolute; top: 0; left: 12.5%; transform: translateX(-50%); font-size: 14px; font-weight: 500; color: #F2B13B">2 с</span>
      <span style="position: absolute; top: 20px; left: 12.5%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #F2B13B"></span>
      <div style="position: relative; height: 16px; border-radius: 8px; background: #2A2A2A; border: 1.5px solid #3A3A3A; overflow: hidden">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 12.5%; background: #F2B13B"></span>
        <span style="position: absolute; left: 25%; top: 0; bottom: 0; width: 2px; background: #A3A3A3" aria-hidden="true"></span>
        <span class="tick" style="left: 6.25%"></span><span class="tick" style="left: 12.5%"></span><span class="tick" style="left: 43.75%"></span><span class="tick" style="left: 68.75%"></span>
      </div>
      <span style="position: absolute; right: 0; top: 4px; font-size: 12px; color: #A3A3A3">серая метка: докуда дошла Алина</span>
    </section>

    <button class="play" type="button" aria-label="Слушать 2 секунды"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px;margin-left:4px"><path d="M7 5v14l12-7z"/></svg></button>

    <form style="width: 100%; max-width: 640px; display: flex; gap: 10px">
      <label for="guess" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Твой ответ</label>
      <div style="flex: 1; position: relative; display: flex; align-items: center">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 16px; color: #A3A3A3"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="guess" type="text" placeholder="Исполнитель или название" autocomplete="off" style="width: 100%; height: 56px; border-radius: 14px; border: 1.5px solid #3A3A3A; background: #1C1C1C; color: #F2F2F2; padding: 0 16px 0 48px; font: inherit; font-size: 16px; box-sizing: border-box">
      </div>
      <button class="btn" type="button">Пропустить</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
