<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Игра в поднятом контрасте</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A1A1A}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
.h{font-family:"Unbounded",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:999px;border:1.5px solid transparent;background:transparent;color:#ABABAB;display:grid;place-items:center;cursor:pointer}
.ib:hover{border-color:#474747;color:#F2F2F2}
.row{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;box-sizing:border-box;border:1.5px solid #474747}
.play{width:88px;height:88px;border-radius:999px;border:0;background:#F2B13B;color:#1A1A1A;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 6px rgba(242,177,59,.14)}
.btn{font:inherit;font-weight:600;font-size:16px;height:56px;padding:0 24px;border-radius:14px;cursor:pointer;border:1.5px solid #474747;background:#242424;color:#F2F2F2;white-space:nowrap}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#1A1A1A}
</style>
</helmet>
<div style="font-family: 'Onest', system-ui, sans-serif; color: #F2F2F2; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1280px; width: 100%; margin: 0 auto; box-sizing: border-box">
    <div style="flex: 1; display: flex"><button class="ib" type="button" aria-label="Меню"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
    <a href="Game-Lifted.dc.html" class="h" style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Guessverse</a>
    <div style="flex: 1; display: flex; gap: 4px; align-items: center; justify-content: flex-end">
      <button class="ib" type="button" aria-label="Как играть"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></svg></button>
      <button class="ib" type="button" aria-label="Прошлые дни"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <a href="Profile.dc.html" aria-label="Профиль" style="width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid #474747; display: grid; place-items: center; font-weight: 600; font-size: 13px; margin-left: 6px">ИЛ</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 16px 24px 48px; box-sizing: border-box">
    <section style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2px 4px">
        <div style="display: flex; align-items: baseline; gap: 10px"><span class="h" style="font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">3</span><span class="h" style="font-size: 15px; font-weight: 500; color: #ABABAB">раунд из 10</span></div>
        <span style="font-size: 14px; color: #ABABAB; display: inline-flex; align-items: center; gap: 8px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>Музыка · сегодняшняя игра · серия 12 дней</span>
      </div>
      <div class="row" style="background: #552828; border-color: #7A3838"><span>Muse — Hysteria</span><svg class="ico" viewBox="0 0 24 24" role="img" aria-label="Мимо" style="color:#F2A0A0"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="row" style="background: #5A4516; border-color: #7A5F1E"><span>Radiohead — Karma Police</span><span style="font-size: 13px; color: #F2B13B; font-weight: 600">исполнитель верный</span></div>
      <div class="row" style="background: #2E2E2E; justify-content: center"><span style="color: #ABABAB">Пропуск</span></div>
      <div class="row" style="border-color: #F2B13B; background: #242424; box-shadow: 0 0 0 4px rgba(242,177,59,.14)"></div>
      <div class="row"></div>
      <div class="row"></div>
    </section>

    <section style="width: 100%; max-width: 640px; position: relative; padding-top: 30px">
      <span class="h" style="position: absolute; top: 0; left: 43.75%; transform: translateX(-50%); font-size: 14px; font-weight: 500; color: #F2B13B">7 с</span>
      <span style="position: absolute; top: 20px; left: 43.75%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #F2B13B"></span>
      <div style="position: relative; height: 16px; border-radius: 8px; background: #333333; border: 1.5px solid #474747; overflow: hidden">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 43.75%; background: #F2B13B"></span>
        <span class="tick" style="left: 6.25%"></span><span class="tick" style="left: 12.5%"></span><span class="tick" style="left: 25%"></span><span class="tick" style="left: 43.75%"></span><span class="tick" style="left: 68.75%"></span>
      </div>
    </section>

    <button class="play" type="button" aria-label="Слушать 7 секунд"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px;margin-left:4px"><path d="M7 5v14l12-7z"/></svg></button>

    <form style="width: 100%; max-width: 640px; display: flex; gap: 10px; position: relative">
      <label for="guess" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Твой ответ</label>
      <div style="position: absolute; left: 0; right: 0; bottom: 64px; background: #242424; border: 1.5px solid #474747; border-radius: 14px; overflow: hidden; font-size: 15px">
        <div style="padding: 12px 16px; background: #2E2E2E; display: flex; justify-content: space-between"><span>Creep — <b>Radiohead</b></span><span style="color: #ABABAB; font-size: 13px">1992</span></div>
        <div style="padding: 12px 16px; display: flex; justify-content: space-between"><span>No Surprises — <b>Radiohead</b></span><span style="color: #ABABAB; font-size: 13px">1997</span></div>
        <div style="padding: 12px 16px; display: flex; justify-content: space-between"><span>Radio Ga Ga — <b>Queen</b></span><span style="color: #ABABAB; font-size: 13px">1984</span></div>
      </div>
      <div style="flex: 1; position: relative; display: flex; align-items: center">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 16px; color: #ABABAB"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="guess" type="text" value="rad" autocomplete="off" style="width: 100%; height: 56px; border-radius: 14px; border: 1.5px solid #F2B13B; background: #242424; color: #F2F2F2; padding: 0 16px 0 48px; font: inherit; font-size: 16px; box-sizing: border-box; box-shadow: 0 0 0 4px rgba(242,177,59,.14)">
      </div>
      <button class="btn" type="button">Пропустить</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
